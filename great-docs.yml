# great-docs configuration for rustest.
#
# Generated by `great-docs init` (which discovered the `reference:` block below by
# introspecting `python/rustest`) and then hand-edited for nav, branding and the
# user-guide ordering. Replaces `zensical.toml`, which is deleted.
#
# Build:   uv run poe docs-build     (writes the ephemeral, gitignored `great-docs/`)
# Preview: uv run poe docs           (local server)
#
# Both need the **Quarto CLI** on PATH -- a prerequisite zensical did not have.
# See `user_guide/development.md` for the install command per platform.

project_name: rustest
display_name: rustest
site_url: "https://apex-engineers-inc.github.io/rustest/"

# The docstring format used in `python/rustest` (auto-detected by `great-docs init`).
parser: google

# Static analysis rather than runtime introspection. `great-docs init` probed both and
# chose this one: `python/rustest/__init__.py` exports lazily over a PyO3 extension, and
# the probe reported "Detected 2 cyclic alias error(s)". Do not flip this without
# re-running the probe.
dynamic: false

logo:
  light: assets/logo-icon.svg
  dark: assets/logo-icon.svg
  # Otherwise the bar is a mark followed immediately by the "Reference" nav item, and the
  # site never says its own name.
  show_title: true
favicon: assets/favicon.ico

repo_url: "https://github.com/Apex-Engineers-Inc/rustest"
github_style: icon

# The site index is `user_guide/index.md` with the hero below prepended, rather than
# `README.md`. The README has to earn its place on a GitHub project page -- badges,
# install line, the compatibility table -- and a landing page has a different job. Pointing
# both at one file made each of them worse.
homepage: user_guide

# The hero is written by hand at the top of `user_guide/index.md` rather than generated
# from a `hero:` block here, for two reasons. It wants an install line and two buttons,
# which the generated hero has no slot for -- and great-docs 0.16.0 emits the generated one
# as ```` ```{=html}  # pragma: no cover ````, a stray coverage pragma on the fence line
# (`core.py:6374`). Pandoc does not recognise that as a raw-HTML opener, so the fence falls
# through and swallows the first real code block on the page as literal text. Re-check this
# before turning `hero:` back on after a great-docs upgrade.
hero: false

# Start each terminal recording when the reader reaches it.
#
# great-docs' own `autoplay="true"` starts every player as soon as the page initialises, and
# these recordings run two to five seconds. Anything below the fold is therefore over before
# the reader arrives: they scroll down to a still frame with a replay button on it, which is
# the opposite of what a recording is for. Every `{{< termshow >}}` on the site passes
# `autoplay="false" loop="false"` and this starts them on visibility instead.
#
# It lives inline rather than in `docs/assets/` because `site.css` is the only asset key
# great-docs copies into the build directory; there is no equivalent for a script file, and
# a pre-render hook to copy one in is more machinery than 20 lines of JavaScript deserve.
include_in_header:
  - text: |
      <script>
      (function () {
        var THRESHOLD = 0.35, POLL_MS = 100, POLL_LIMIT = 60;
        function pressPlay(el) {
          var tries = 0;
          (function attempt() {
            var btn = el.querySelector(".gd-tp-play-btn");
            // Only press a stopped player, so a reader who paused one deliberately is not
            // overridden by their own scrolling.
            if (btn) { if (!el.classList.contains("gd-tp-playing")) btn.click(); return; }
            if (++tries < POLL_LIMIT) window.setTimeout(attempt, POLL_MS);
          })();
        }
        function init() {
          var players = document.querySelectorAll(".gd-termshow");
          if (!players.length) return;
          if (!("IntersectionObserver" in window)) {
            Array.prototype.forEach.call(players, pressPlay);
            return;
          }
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (!e.isIntersecting) return;
              io.unobserve(e.target);
              pressPlay(e.target);
            });
          }, { threshold: THRESHOLD });
          Array.prototype.forEach.call(players, function (el) { io.observe(el); });
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
      </script>

# Deep orange, which is the colour the previous site ran and the one this project is
# recognised by. `docs/assets/rustest.css` builds the rest of the palette out from it.
accent_color:
  light: "#d84315"
  dark: "#ff7043"

authors:
  - name: rustest contributors
    role: Author

# The changelog page is authored, not scraped: `changelog:` would generate it from GitHub
# Releases, and this project's history lives in `CHANGELOG.md` (copied to
# `user_guide/changelog.md` by the `sync-changelog` pre-commit hook).
changelog:
  enabled: false

site:
  theme: flatly
  toc: true
  toc-depth: 2
  # Loaded after great-docs' own SCSS, so it can override without fighting.
  css: docs/assets/rustest.css

jupyter: python3

# The narrative docs. `user_guide/` is FLAT by great-docs' design
# (`core.py::_copy_user_guide_files` globs one level deep and copies by basename), which
# is why the six beginner pages carry an `intro-` prefix rather than living in a
# `new-to-testing/` subdirectory.
#
# The pages are `.md`, not `.qmd`, and that is load-bearing: great-docs and Quarto render
# both, but **rustest's own doc-code-block collector keys on `.md`**
# (`src/engine/collect.rs::is_markdown`), so authoring in `.md` is what keeps every example on
# these pages executing as a test in CI. See `user_guide/markdown-testing.md`.
user_guide:
  - section: "Get Started"
    contents:
      - index.md
      - installation.md
      - quickstart.md
  - section: "New to Testing?"
    contents:
      - intro-why-test.md
      - intro-testing-basics.md
      - intro-first-test.md
      - intro-fixtures.md
      - intro-organizing.md
      - intro-parametrization.md
  - section: "Writing Tests"
    contents:
      - writing-tests.md
      - fixtures.md
      - parametrization.md
      - marks.md
      - test-classes.md
      - assertions.md
      - async-testing.md
  - section: "Running Tests"
    contents:
      - cli.md
      - project-structure.md
      - markdown-testing.md
      - coverage.md
      - llm-output.md
      - python-api.md
  - section: "Coming from pytest"
    contents:
      - pytest-compat.md
      - comparison.md
      - pytest-plugins.md
      - migration-guide.md
  - section: "Reference & Internals"
    contents:
      - performance.md
      - async-event-loops.md
      - development.md
      - changelog.md

# The API reference, auto-generated from `python/rustest`'s docstrings. This replaces the
# five hand-written `docs/api/*.md` pages, which are deleted -- they had to be edited by
# hand every time a signature moved, and several had drifted.
reference:
  - title: Classes
    desc: Main classes provided by the package
    contents:
      - name: Cache
        members: false  # 7 methods listed below
      - CaptureFixture  # 5 method(s)
      - name: ExceptionInfo
        members: false  # 6 methods listed below
      - Failed
      - FixtureRequest  # 5 method(s)
      - name: LogCaptureFixture
        members: false  # 7 methods listed below
      - MarkDecorator  # 2 method(s)
      - name: MockerFixture
        members: false  # 6 methods listed below
      - name: MonkeyPatch
