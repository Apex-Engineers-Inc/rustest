# great-docs configuration for rustest.
#
# Generated by `great-docs init` (which discovered the `reference:` block below by
# introspecting `python/rustest`) and then hand-edited for nav, branding and the
# user-guide ordering. Replaces `zensical.toml`, which is deleted.
#
# Build:   uv run poe docs-build     (writes the ephemeral, gitignored `great-docs/`)
# Preview: uv run poe docs           (local server)
#
# Both need the **Quarto CLI** on PATH -- a prerequisite zensical did not have.
# See `user_guide/development.md` for the install command per platform.

project_name: rustest
display_name: rustest
site_url: "https://apex-engineers-inc.github.io/rustest/"

# The docstring format used in `python/rustest` (auto-detected by `great-docs init`).
parser: google

# Static analysis rather than runtime introspection. `great-docs init` probed both and
# chose this one: `python/rustest/__init__.py` exports lazily over a PyO3 extension, and
# the probe reported "Detected 2 cyclic alias error(s)". Do not flip this without
# re-running the probe.
dynamic: false

logo: assets/logo.svg
favicon: assets/favicon.ico

repo_url: "https://github.com/Apex-Engineers-Inc/rustest"
github_style: icon

authors:
  - name: rustest contributors
    role: Author

# The changelog page is authored, not scraped: `changelog:` would generate it from GitHub
# Releases, and this project's history lives in `CHANGELOG.md` (copied to
# `user_guide/changelog.md` by the `sync-changelog` pre-commit hook).
changelog:
  enabled: false

site:
  theme: flatly
  toc: true
  toc-depth: 2

jupyter: python3

# The narrative docs. `user_guide/` is FLAT by great-docs' design
# (`core.py::_copy_user_guide_files` globs one level deep and copies by basename), which
# is why the six beginner pages carry an `intro-` prefix rather than living in a
# `new-to-testing/` subdirectory.
#
# The pages are `.md`, not `.qmd`, and that is load-bearing: great-docs and Quarto render
# both, but **rustest's own doc-code-block collector keys on `.md`**
# (`src/engine/collect.rs::is_markdown`), so authoring in `.md` is what keeps every example on
# these pages executing as a test in CI. See `user_guide/markdown-testing.md`.
user_guide:
  - section: "Get Started"
    contents:
      - index.md
      - installation.md
      - quickstart.md
  - section: "New to Testing?"
    contents:
      - intro-why-test.md
      - intro-testing-basics.md
      - intro-first-test.md
      - intro-fixtures.md
      - intro-organizing.md
      - intro-parametrization.md
  - section: "Writing Tests"
    contents:
      - writing-tests.md
      - fixtures.md
      - parametrization.md
      - marks.md
      - test-classes.md
      - assertions.md
      - async-testing.md
  - section: "Running Tests"
    contents:
      - cli.md
      - project-structure.md
      - markdown-testing.md
      - coverage.md
      - llm-output.md
      - python-api.md
  - section: "Coming from pytest"
    contents:
      - pytest-compat.md
      - comparison.md
      - pytest-plugins.md
      - migration-guide.md
  - section: "Reference & Internals"
    contents:
      - performance.md
      - async-event-loops.md
      - development.md
      - changelog.md

# The API reference, auto-generated from `python/rustest`'s docstrings. This replaces the
# five hand-written `docs/api/*.md` pages, which are deleted -- they had to be edited by
# hand every time a signature moved, and several had drifted.
reference:
  - title: Classes
    desc: Main classes provided by the package
    contents:
      - name: Cache
        members: false  # 7 methods listed below
      - CaptureFixture  # 5 method(s)
      - name: ExceptionInfo
        members: false  # 6 methods listed below
      - Failed
      - FixtureRequest  # 5 method(s)
      - name: LogCaptureFixture
        members: false  # 7 methods listed below
      - MarkDecorator  # 2 method(s)
      - name: MockerFixture
        members: false  # 6 methods listed below
      - name: MonkeyPatch
        members: false  # 10 methods listed below
      - ParameterSet  # 1 method(s)
      - RaisesContext  # 3 method(s)
      - Skipped
      - TmpDirFactory  # 3 method(s)
      - TmpPathFactory  # 3 method(s)
      - XFailed
      - approx.ApproxBase
      - approx.ApproxDecimal
      - approx.ApproxMapping
      - approx.ApproxNumpy
      - approx.ApproxScalar
