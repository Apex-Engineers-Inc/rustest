[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "rustest"
version = "0.16.2"
description = "Rust powered pytest-compatible runner"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "rustest contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typing-extensions>=4.15",
    "rich>=13.0.0",
]
scripts = { rustest = "rustest.__main__:main" }

[project.optional-dependencies]
# `--cov` is opt-in packaging, not a hard dependency: see
# `python/rustest/_v2_coverage.py`'s module docstring for the decision (coverage.py's data
# API over a hand-rolled lcov writer) and `docs/advanced/coverage.md` for the user-facing
# half. A run without `--cov` never imports `coverage`, so the extra costs a user who does
# not ask for coverage exactly nothing.
cov = [
    "coverage>=7.6",
]
dev = [
    "basedpyright>=1.19",
    # The `cov` extra, present here so this repository's own gates can exercise the coverage
    # path and diff it against coverage.py.  `coverage` registers no pytest plugin (unlike
    # pytest-cov, which is deliberately NOT installed), so its presence changes nothing about
    # what the pytest leg of the conformance gates loads.
    "coverage>=7.6",
    "maturin>=1.4,<2",
    # `conformance/corpus/builtins/approx-numpy` grades `ndarray == approx(...)` -- the
    # dispatch mechanism (`__array_ufunc__ = None` / `__array_priority__ = 100`) that cost
    # Apex Member Designer two tests before `approx` became a port. It is DECLARED rather
    # than left to `pytest.importorskip` because an undeclared optional dependency makes
    # that case's verdict a function of the machine: with numpy the v1 gate matched, without
    # it pytest skipped the module while v1 turned the module-level skip into a collection
    # error (exit 2 vs 0) and the gate went red in CI only. numpy registers no pytest plugin,
    # so its presence changes nothing about what either leg of the gates loads.
    "numpy>=1.26",
    "packaging>=20.0",
    "poethepoet>=0.22",
    "pre-commit>=3.5",
    "py>=1.11",
    "pytest>=7.0",
    "pytest-asyncio>=1.2.0",
    "pytest-codeblocks>=0.17.0",
    "ruff>=0.1.9",
]
docs = [
    "zensical",
]

[project.urls]
Homepage = "https://github.com/Apex-Engineers-Inc/rustest"
Repository = "https://github.com/Apex-Engineers-Inc/rustest"
Documentation = "https://apex-engineers-inc.github.io/rustest"

[tool.maturin]
module-name = "rustest.rust"
python-source = "python"
compatibility = "manylinux2014"

[tool.poe.tasks]
build = "uv build"
dev = "uv run maturin develop"
fmt = "cargo fmt"
lint = "uv run --all-extras ruff check python conformance"
typecheck = "uv run --all-extras basedpyright python conformance"
pytests = "uv run pytest python/tests -v"
tests = "uv run rustest tests/ examples/tests/"
demos = "bash scripts/generate-demos.sh"
docs = "uv run zensical serve"

[tool.ruff]
line-length = 100
# `conformance/real/_work` holds shallow clones of the OSS validation targets. They are
# other projects' source at pinned revisions -- linting or reformatting them would be both
# meaningless and a modification of the thing under test. (They are gitignored, but each
# clone is its own git repo, so ruff's gitignore discovery does not reach them.)
extend-exclude = ["conformance/corpus", "conformance/real/_work"]

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
strictParameterNoneValue = true
reportMissingTypeStubs = false
reportImportCycles = false
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownParameterType = "warning"
reportUnknownLambdaType = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitStringConcatenation = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
include = ["python/rustest", "conformance"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "**/*.pyc",
    "**/tests",
    "python/rustest/_pytest_stub",
    "conformance/corpus",
    # Shallow clones of the `--real` validation targets: other projects' source, pinned.
    "conformance/real/_work",
]

[tool.uv]
managed = true

[tool.uv.sources]
rustest = { path = "." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Set explicitly, which is what pytest-asyncio's own PytestDeprecationWarning asks every
# project to do ("The event loop scope for asynchronous fixtures will default to the fixture
# caching scope. Future versions ... will default ... to function scope. Set the default
# fixture loop scope explicitly in order to avoid unexpected behavior in the future").
#
# `session`/`session` is also the shape rustest's own async suites were written against.
# They predate the loop-scope model (they exercise v1's "widest fixture scope wins"
# auto-detection) and assume every fixture and every test share one loop; under the ported
# pytest-asyncio model with these options UNSET, a session-scoped async fixture gets a
# session loop while a test gets a function loop, and `tests/test_async_fixture_event_loop_issue.py`
# reports "Task got Future attached to a different loop" -- which real pytest + pytest-asyncio
# does too, measured on the same file. Declaring the scopes is the fix pytest-asyncio
# documents, not a workaround for rustest.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
python_files = ["test_*.py", "*_test.py", "pytest_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "fast: marks tests as fast",
    "timeout: marks tests with timeout requirement",
    "custom: custom mark with arbitrary parameters",
    "regression: marks tests for regression testing",
    "smoke: marks tests for smoke testing",
    "critical: marks tests as critical",
]

[tool.pytest_codeblocks]
# Test Python code blocks in markdown files
# Use <!--pytest-codeblocks:skip--> HTML comments to skip individual blocks
