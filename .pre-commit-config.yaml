# Pre-commit hooks for rustest
# See https://pre-commit.com for more information
#
# Installation:
#   1. Install pre-commit: pip install pre-commit
#   2. Install git hooks: pre-commit install
#
# Usage:
#   - Runs automatically on git commit
#   - Run manually on all files: pre-commit run --all-files
#   - Skip hooks for a commit: git commit --no-verify

repos:
  # Python formatting and linting with ruff.
  #
  # `rev` MUST match the version `[project.optional-dependencies] dev` resolves in
  # `uv.lock` (#134). They were v0.8.4 here against 0.14.x there -- six minor releases
  # apart -- and the two disagree about real formatting decisions, so a file that
  # satisfied `pre-commit run` was reformatted by the CI `ruff format` step and vice
  # versa. The lock pins one version; this pins the same one; `pyproject.toml`'s
  # `ruff>=0.14.3,<0.15` keeps a `uv lock --upgrade` from silently walking away from it.
  #
  # To bump: change the floor in `pyproject.toml`, run `uv lock --upgrade-package ruff`,
  # then set `rev` to whatever the lock now says. All three in one commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      # Run the formatter
      - id: ruff-format
        name: ruff format
        files: ^(python|conformance)/

      # Run the linter
      - id: ruff
        name: ruff check
        args: [--fix]
        files: ^(python|conformance)/

  # Python type checking with basedpyright
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.390
    hooks:
      - id: pyright
        name: basedpyright
        entry: basedpyright
        args: [python, conformance]
        language: python
        types: [python]
        pass_filenames: false
        # Pinned to the version `uv.lock` resolves, for the same reason `rev` is pinned
        # above: an unbounded floor here resolves to "whatever was latest when the hook
        # environment was built", which is a different type checker from the one the CI
        # `basedpyright` step runs on any machine whose hook cache is older.
        additional_dependencies:
          - basedpyright==1.32.1
          - packaging>=20.0
          - py>=1.11

  # Rust formatting with cargo fmt
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false

  # Rust linting with clippy
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy
        args: [--lib, --, -D, warnings]
        language: system
        types: [rust]
        pass_filenames: false

  # Sync root CHANGELOG.md into the documentation site.
  #
  # The target moved from `docs/CHANGELOG.md` to `user_guide/changelog.md` with the
  # great-docs cutover: `user_guide/` is the site's content directory now, and great-docs'
  # own `changelog:` key (which scrapes GitHub Releases) is disabled in `great-docs.yml`
  # precisely so this file stays the single authored source.
  - repo: local
    hooks:
      - id: sync-changelog
        name: sync changelog to docs
        entry: bash -c 'cp CHANGELOG.md user_guide/changelog.md && git add user_guide/changelog.md'
        language: system
        files: ^CHANGELOG\.md$
        pass_filenames: false

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
