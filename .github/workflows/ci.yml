name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and build package
        run: uv sync --all-extras

      # Added in Phase 4 Task 2, and only possible because of it: half of `cargo test` was
      # the v1 engine's, and #133 recorded those tests as dead weight that could not be made
      # green. With v1 deleted the suite is 397 tests and fully green, so it becomes a gate
      # rather than a skip-list.
      #
      # `--test-threads=1` is not caution, it is the ledger's note: these tests spawn real
      # Python worker pools and drive real subprocesses, so running the suite's own cases
      # concurrently puts several pools on one runner at once. That is exactly the concurrent
      # load that produced the misread subprocess timeout recorded in the P1b.2 Task 5 report
      # §10.7, and a flaky gate teaches people to re-run rather than to read.
      # `--no-default-features` drops `extension-module`, which must be off for a test
      # *executable*: with it on, pyo3 leaves the CPython symbols undefined for a host
      # interpreter to supply, and a test binary has no host -- on Linux that is a wall of
      # `undefined symbol: PyObject_GetAttr`-style link errors. Windows links `pythonXY.lib`
      # either way, which is why this only ever failed once CI ran the suite on Linux.
      # These tests drive real Python worker pools, so the binary needs a real libpython to
      # link against and to find at run time; `PYO3_PYTHON` picks the matrix interpreter and
      # `LD_LIBRARY_PATH` points at the `lib/` beside it.
      - name: Run Rust tests
        run: |
          set -euo pipefail
          PY="$(uv python find ${{ matrix.python-version }})"
          echo "Using interpreter: $PY"
          export PYO3_PYTHON="$PY"
          export LD_LIBRARY_PATH="$(dirname "$(dirname "$PY")")/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --no-default-features -- --test-threads=1

      - name: Run Python unit tests with pytest
        run: .venv/bin/pytest python/tests -v -ra

      - name: Run all integration tests with pytest
        run: .venv/bin/pytest tests/ examples/tests/ -v -ra

      # There is one engine, and the pytest compatibility shim is always installed, so this
      # is the whole of the self-suite run. `--pytest-compat` was deleted at the Phase 1c
      # flip and `--v1` with the engine it selected in Phase 4 Task 2; both now exit 4.
      - name: Run all integration tests with rustest
        run: .venv/bin/python -m rustest tests/ examples/tests/ -v

      - name: Test documentation code blocks with rustest
        run: .venv/bin/python -m rustest README.md user_guide/*.md
        # Markdown is named, not walked: since 0.18 a *directory* argument collects no
        # `.md` at all, because pytest walking the same tree collects none either and a
        # repo with python fences in its docs was getting tests under `rustest tests/`
        # that `pytest tests/` never sees. Naming the files keeps the docs tested.
        #
        # `user_guide/*.md` is the WHOLE site now, not the four-directory subset this
        # line used to name -- that subset was an artifact of the old `docs/` tree, and
        # the pages outside it (the beginner track, the pytest-comparison pages) were
        # never checked. The great-docs cutover also settles the question its research
        # raised: the site is authored in `.md`, not `.qmd`, so this collector still sees
        # every page. great-docs and Quarto render both formats, but rustest's collector
        # keys on `.md` (`src/v2/collect.rs::is_markdown`), and keeping the source
        # extension is what keeps the examples executable. Quarto's own executable fences
        # are spelled ```{python}, which this collector deliberately does not match.

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Auto-fix Python formatting with ruff
        run: uv run --no-project ruff format python conformance

      - name: Auto-fix Python linting with ruff
        run: uv run --no-project ruff check --fix python conformance

      - name: Auto-fix Rust formatting
        run: cargo fmt

      - name: Commit and push formatting changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-fix formatting and linting"
            git push
          fi

      - name: Check Python formatting with ruff
        run: uv run --no-project ruff format --check python conformance

      - name: Lint Python with ruff
        run: uv run --no-project ruff check python conformance

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust with clippy
        run: cargo clippy --lib -- -D warnings

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Type check with basedpyright
        run: uv run --no-project basedpyright python conformance
