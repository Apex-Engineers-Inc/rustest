name: Deploy Documentation

on:
  workflow_call:  # Called by publish.yml after successful PyPI release
  workflow_dispatch:  # Manual trigger for rebuilding docs
  # Build only: a pull request checks that the site still builds and uploads it for
  # inspection. The `deploy` job below never runs for one.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "README.md"
      - "great-docs.yml"
      - "user_guide/**"
      - "demos/**"
      - "docs/**"
      - "python/rustest/**"
      - "pyproject.toml"

# Read-only by default; only the deploy job, which a pull request skips, may write Pages.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # great-docs shells out to `quarto render`, so the Quarto CLI is a build
      # prerequisite that zensical did not have. It is not a Python package and cannot be
      # installed by uv.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The API reference is generated by introspecting `python/rustest`, so the compiled
      # extension has to build here -- `uv pip install --editable .` runs maturin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # `--group docs`, not `.[docs]`: the docs toolchain is a dependency group precisely
      # so that `uv sync --all-extras` in `ci.yml` does not pull great-docs' transitive
      # `anyio` pytest plugin into the environment the conformance gates run in. See the
      # `[dependency-groups] docs` comment in `pyproject.toml`.
      - name: Install dependencies
        run: |
          uv pip install --system --group docs
          uv pip install --system --editable .

      - name: Build documentation
        env:
          PYTHONUTF8: '1'
        run: great-docs build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./great-docs/_site

      - name: Upload site for inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ./great-docs/_site
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
