# Documented divergences between a real pytest run and `rustest --v2`.
#
# This is the Phase 1b.2 full-run gate's ledger, kept separate from waivers.toml (the
# v1 end-to-end ledger) and waivers-v2-collect.toml (the v2 collection ledger) because
# an entry in one says nothing about the others. `collection/unittest-basic` is waived
# for v1 (#129: every unittest outcome graded PASSED), matches under v2-collect, and
# matches here; `marks/xfail-strict` is waived for v1 (no xfail concept at all) and
# matches under both v2 gates.
#
# Graded: the ORDERED node ids the schema-v2 report carries, the six-value outcome
# tally (passed/failed/skipped/xfailed/xpassed/error), and the process exit code.
# Nothing else -- stdout and stderr prose differ from pytest's by design, and worker
# stderr legitimately carries boundary teardown output on a green run.
#
# Every entry MUST carry the mechanism and a file:line. Phase gates shrink this file;
# a waiver whose case starts matching is reported as a STALE-WAIVER and fails the run.
#
# Gate: `uv run python -m conformance --v2-run`
# Scoreboard at 1b.2: 23 cases -- 23 match, 0 waived, 0 stale-waivers, 0 diverged.
# Scoreboard at 1c.2: 27 cases -- 24 match, 3 waived, 0 stale-waivers, 0 diverged.
#
# THIS FILE WAS EMPTY AT 1b.2 AND IS NO LONGER. All three entries below arrived with the
# four 1c Task 2 corpus additions: they are shapes the 1b.2 corpus did not contain, not
# regressions in anything it did. Each was adjudicated on probed evidence and names its
# own fix shape. The fourth addition, collection/dupe-args, MATCHES.
#
# The 1b.2 headline it replaces is still true of the cases it was about: every execution
# divergence the corpus found in v1 -- #129 (unittest outcomes swallowed), #130 (conftest
# loaded twice), #131 (skipif ignored), xfail with no outcome to put it in, strict xfail,
# and the missing exit-5 branch in two cases -- is fixed in v2.
# `test_v2_run_ledger_holds_only_adjudicated_waivers` in conformance/tests/test_main.py
# enforces that a new entry still cannot appear quietly: the set is asserted by name.
[cases]

"fixtures/session-scope" = "NEW-BUG, and NARROWER THAN THE DOCUMENTED LIMITATION (added at 1c Task 2). A session-scoped fixture declared in conftest.py and requested by two sibling FILES is set up TWICE, so the second file's tests see a fresh object. pytest: 2 passed, exit 0 -- one session fixture for the run. rustest --v2: 1 passed / 1 failed, exit 1, with test_b_second failing on assert visits == ['first', 'second'] because its visits is a different list. MECHANISM, PROBED RATHER THAN ASSUMED: this is NOT the per-worker split the code already documents. _SCOPE_BUCKET (python/rustest/_v2_worker.py:1218) collapses session and package onto one worker-lifetime bucket and its comment says a session fixture 'executes once PER WORKER rather than once per run'. The real granularity is once per FILE: with -n 1 -- one worker, both files -- the fixture still runs twice. Two tests in the SAME file share it correctly (probed: one SESSION-FIXTURE-SETUP line, 2 passed), which locates the boundary exactly. The cause is handle_collect_file calling build_registry (python/rustest/_v2_worker.py:2546) once per file: the conftest MODULE is cached, but parse_factories builds FRESH FixtureDef objects from it on every call, and FixtureRunner._cache is dict[FixtureDef, _Cached] keyed by IDENTITY -- FixtureDef is @dataclass(eq=False) (python/rustest/_v2_worker.py:1276) precisely so that it keys the cache the way pytest keys off its own FixtureDef object. Two files therefore present two different keys for the same conftest fixture and the cache misses. teardown('module') is NOT the cause: it unwinds only the function/class/module buckets (python/rustest/_v2_worker.py:2273-2281), so the session finalizers survive -- they simply accumulate, one per file. CONSEQUENCE BEYOND THIS CASE: a session fixture with a yield teardown runs its setup N times and its teardown N times at shutdown, where pytest would do each once. FIX SHAPE (Phase 2/3, not here): cache FixtureDef objects per (conftest path, fixture name) so a re-registration returns the same object, which fixes -n 1 outright and reduces the residue to the genuine cross-worker problem the spec already owns. The _SCOPE_BUCKET comment has been corrected in this task's commit so the source no longer overstates the guarantee. Pre-waiver detail: outcomes (passed/failed/skipped/xfailed/xpassed/errors/deselected) pytest=2/0/0/0/0/0/0 v2=1/1/0/0/0/0/0; exit codes pytest=0 v2=1."

"marks/pytest-exit" = "PREDICTED and CONFIRMED (added at 1c Task 2): pytest.exit() from inside a test body is a SILENT NO-OP in the compat shim, so the session does not stop. pytest raises Exit (not Interrupted), keeps the reports already produced and exits 2: 1 passed, exit 2, test_never never executed. rustest --v2: 2 passed / 1 failed, exit 1 -- test_bails PASSES because the call did nothing, and test_never then runs and raises its deliberate AssertionError. MECHANISM: exit is not defined in python/rustest/compat/pytest.py, so it reaches that module's catch-all __getattr__ (python/rustest/compat/pytest.py:1019), which manufactures a do-nothing stub CLASS for any unknown public attribute; calling it constructs <exit (rustest compat stub)> and returns. The stub table exists so plugins can import pytest internals without exploding; the cost is that a called control-flow function silently succeeds. SEVERITY: silent-false-green class (same class as #129 and the async false-green fixed at 1c Task 1) -- the bail-out itself reports nothing at all, and the run's verdict is whatever the tests that should never have run happen to do. NOT FIXED HERE: real parity needs a session-stop op on the worker wire (PROTOCOL_VERSION bump, mutation harness owed), and the cheap half-fix -- making the stub raise -- would change the FROZEN v1 shim for every attribute reached through it and would still diverge from pytest (an error rather than a stop). Recommended as a standalone task; this case is the pin that keeps it from being forgotten. NOTE ON THE GATE ITSELF: this is the shape P1b.2 Task 5 Sec 10.2 rekeyed the nothing-ran rule for, and the rekey is doing its job -- the COLLECT pass exits 0 with 3 ids, so pytest's id list is kept and the divergence is reported through the TALLY and the exit code, where it belongs, instead of as a phantom empty collection. Pre-waiver detail: outcomes (passed/failed/skipped/xfailed/xpassed/errors/deselected) pytest=1/0/0/0/0/0/0 v2=2/1/0/0/0/0/0; exit codes pytest=2 v2=1."

"fixtures/module-param-reorder" = "PREDICTED and CONFIRMED (added at 1c Task 2): v2 does not implement pytest's reorder_items pass, so a module-scoped PARAMETRIZED fixture requested by two tests is emitted -- and executed -- in source order instead of grouped by parameter. pytest: alpha[one], beta[one], alpha[two], beta[two]. v2: alpha[one], alpha[two], beta[one], beta[two]. MECHANISM: _pytest/fixtures.py::reorder_items runs as part of pytest_collection_modifyitems and needs the WHOLE session's item list to group by the higher-scoped parameter; v2 collects file by file in a worker pool and has no such pass -- the limitation is already written down at python/rustest/_v2_worker.py:97-102, which predicted exactly this outcome: a module-scoped two-value fixture costs 2 setups under pytest (grouped) and 4 here. Both halves PROBED with a printing fixture: pytest 2 setups (SETUP one, SETUP two), v2 4 (SETUP one, SETUP two, SETUP one, SETUP two). WHAT THE GATE ACTUALLY SEES, and why the case earns its place: the TALLY MATCHES -- 4 passed on both sides, exit 0 on both sides -- and the id SETS are identical. The divergence is visible ONLY through the ordered id comparison. A set-based or tally-based grader certifies this green, which is precisely what happens on the v1 gate, where this case MATCHES. That makes it the corpus's demonstration that ordered ids are load-bearing rather than pedantic. It is also a real behavioural cost, not a cosmetic one: double the fixture setups, paid in full by any fixture whose setup is expensive or non-idempotent. DEFERRED to the Phase 2/3 decision on item reordering (1c Task 1 report Sec 8, behavioural gap 9): the pass needs the manifest assembled before dispatch, which is a scheduler change, not a worker change. Pre-waiver detail: id order: first divergence at index 1 (pytest='test_module_param_reorder.py::test_beta[one]', v2='test_module_param_reorder.py::test_alpha[two]')."
