# Documented divergences between pytest and rustest v1.
# Every entry MUST have a reason. v2 phase gates shrink this file.
[cases]
"collection/class-collection" = "v1 collects test methods on classes that define __init__; pytest refuses them (PytestCollectionWarning: 'cannot collect test class ... because it has a __init__ constructor') because it cannot safely instantiate them per test. v1 instantiates the class anyway and runs the method, so TestWithInit::test_ignored is both an extra ID and an extra failure. The audit flagged class-with-__init__ handling as unverified; this run confirms it diverges. Fixed by v2 collection rules (spec: python_classes / class collectability)."

"collection/empty-suite" = "DIVERGE on exit code only (ids and outcome counts agree, both empty): pytest exits 5 ('no tests ran') when a directory has zero collectible tests; rustest exits 0. Mechanism: python/rustest/cli.py:200-209 special-cases only report.collection_errors (-> 2) and report.failed > 0 (-> 1); with both empty/zero it falls through to the trailing `else: return 0`, which has no branch for pytest's 'nothing was collected' outcome. Verified directly, bypassing the harness: in this case dir, `python -m pytest -q --tb=no .` prints 'no tests ran in 0.06s' and exits 5; `python -m rustest . --pytest-compat --color never` prints 'No tests collected' / '0 tests' and exits 0. Waived under the v2 exit-code contract (spec: 'Contracts are pytest's: exit codes 0-5', docs/superpowers/specs/2026-07-25-rustest-v2-architecture-design.md:38) -- this is a real product gap for v2's execution spine to close (add a zero-collected branch to the CLI exit-code table), not a harness artifact."

"collection/unittest-basic" = "NEW-BUG: v1 grades every unittest.TestCase outcome as PASSED. src/discovery.rs:1681 create_unittest_method_runner emits `def run_test(): test_instance = test_class('<method>'); test_instance()`. TestCase.__call__ aliases TestCase.run(), which builds its own TestResult, records failure/error/skip into it, and RETURNS it instead of raising. v1 discards that return value, so run_test() always completes normally and self.assertEqual(1, 2) grades as passed (verified: failures, errors and skips are all swallowed). This is a silent-failure bug -- a migrated unittest suite reports green while genuinely failing -- not merely a collection gap. Fix in Phase 1: run the case against an explicit TestResult, re-raise failures/errors and translate skips to skipped. GitHub: #129"

"fixtures/autouse" = "NEW-BUG: v1 loads conftest.py TWICE as two independent module objects, so state written by a conftest-level fixture is invisible to a test that does `from conftest import ...`. Autouse mechanics themselves are CORRECT -- a probe confirmed the autouse fixture body runs before the test and appends to its own module's list. The defect is module identity: src/discovery.rs:711 load_conftest_fixtures calls infer_module_names(path, module_ids.next()) (line 717); for a conftest.py in a directory with no __init__.py, infer_module_names (src/discovery.rs:2281) takes the components.len() == 1 branch and returns the synthetic name `rustest_module_N` (src/discovery.rs:2304). load_python_module then registers the module in sys.modules under THAT synthetic key (src/discovery.rs:2275) and never under `conftest`. So the autouse fixture closure appends to rustest_module_0.applied, while the test's `from conftest import applied` finds no `conftest` in sys.modules and re-imports conftest.py from disk as a second module whose `applied` is still empty. Probe output: fixture list id ...566656 len 1 vs imported list id ...632640 len 0 -- distinct objects. pytest (default importmode=prepend) inserts the conftest basedir on sys.path and imports it under its real basename, so exactly one `conftest` instance exists and is shared. Effect here: 1 passed (pytest) vs 1 failed (rustest), exit 0 vs 1. Fix in Phase 1: derive conftest/test module names from the file basename the way pytest does and reuse any existing sys.modules entry, so `import conftest` from a test yields the same module object the fixtures were collected from. GitHub: #130"

"marks/deselect-all" = "DIVERGE on exit code only (ids and outcome counts agree, both empty): `-m nosuchmark` deselects the case's only test (`@pytest.mark.smoke`), which pytest treats the same as zero collected tests -- exit 5, '1 deselected'. rustest exits 0 for the identical invocation. Same mechanism as collection/empty-suite: python/rustest/cli.py:200-209 special-cases only report.collection_errors (-> 2) and report.failed > 0 (-> 1), with no branch for 'nothing selected/collected', so zero/zero falls through to `else: return 0`. Verified directly, bypassing the harness: in this case dir, `python -m pytest -q --tb=no -m nosuchmark .` prints '1 deselected in 0.04s' and exits 5; `python -m rustest . --pytest-compat --color never -m nosuchmark` prints 'No tests collected' / '0 tests' and exits 0. Waived under the v2 exit-code contract (spec: 'Contracts are pytest's: exit codes 0-5', docs/superpowers/specs/2026-07-25-rustest-v2-architecture-design.md:38); tracked as the same CLI exit-code gap as collection/empty-suite, not a separate defect."

"marks/skip-and-skipif" = "NEW-BUG: v1 honors @pytest.mark.skip but ignores @pytest.mark.skipif on the decorator path (RequestFixture.applymarker at compat/pytest.py:529-537 does honor it at runtime), so a skipif'd test RUNS its body. Not predicted by the audit, which expected only xfail to diverge here. pytest: `1 passed, 2 skipped` exit 0; rustest: 1 passed / 1 failed / 1 skipped exit 1, with test_skipped_conditionally executing `raise AssertionError('must not run')` and grading as a real failure. The two marks travel different paths. skip: _PytestMarkCompat.skip (python/rustest/compat/pytest.py:684) is a real method that calls rustest.decorators.skip_decorator (python/rustest/decorators.py:252), which sets the `__rustest_skip__` attribute (python/rustest/decorators.py:260); Rust reads that attribute in collect_tests (src/discovery.rs:1178) into TestCase.skip_reason and execution.rs:594 short-circuits the test as skipped -- this works. skipif: _PytestMarkCompat.skipif (python/rustest/compat/pytest.py:692-695) is only a property delegating to MarkGenerator.skipif (python/rustest/decorators.py:634), which returns MarkDecorator('skipif', (condition,), ...); MarkDecorator.__call__ (python/rustest/decorators.py:491-506) ONLY appends the mark dict to `__rustest_marks__` (line 505) -- it never sets `__rustest_skip__` and never sets `pytestmark`. Attribute probe on the case module confirms: test_skipped -> `__rustest_skip__='always skipped'`, no marks; test_skipped_conditionally -> `__rustest_marks__=[{'name':'skipif','args':(True,),'kwargs':{'reason':'condition true'}}]`, `__rustest_skip__` absent, `pytestmark` absent. On the Rust side the only remaining skip source, check_for_pytest_skip_mark (src/discovery.rs:2015-2056), reads the `pytestmark` attribute (line 2023) and matches only `name == \"skip\"` (line 2039); it never inspects `__rustest_marks__` and has no skipif branch. collect_marks (src/discovery.rs:2142) does collect the mark, but the literal `skipif` appears ZERO times anywhere in src/*.rs (verified by grep), so the collected mark is inert. Note the CONDITION is evaluated correctly -- MarkDecorator._normalize_args (python/rustest/decorators.py:508-513) stores args=(True,) for the true condition and (False,) for the false one -- so the fix is consumption, not evaluation. Severity: a platform guard like @skipif(sys.platform=='win32') executes anyway, so migrated suites run tests they explicitly excluded. Fix in Phase 1: fold skipif (and mark-provided skip) into skip_reason during collection by evaluating `__rustest_marks__`, rather than relying on the attribute set by one compat shim. GitHub: #131"

"marks/xfail" = "PREDICTED and CONFIRMED: v1 has no xfail outcome at all, so an expected failure grades as a hard failure and flips the exit code. pytest: `1 passed, 1 xfailed` exit 0; rustest: 1 passed / 1 failed exit 1 (test_xfail.py::test_expected_failure -> status 'failed' in --report-json). Recording exactly how the counts land, as the audit asked: pytest's xfailed test lands in NEITHER the passed nor the failed bucket the harness parses -- _SUMMARY_RE (conformance/harness/runners.py:16) is `(\\d+) (passed|failed|skipped|error|errors)` and the literal summary text is `1 xfailed`, where `failed` is not preceded by a space, so no match -- giving pytest=1/0/0/0 vs rustest=1/1/0/0. Mechanism: pytest.mark.xfail (python/rustest/compat/pytest.py:697-700) is a property delegating to MarkGenerator.xfail (python/rustest/decorators.py:660-694), which returns MarkDecorator('xfail', args, kwargs) and therefore only appends to `__rustest_marks__` (python/rustest/decorators.py:505). Probe confirms: test_expected_failure -> `__rustest_marks__=[{'name':'xfail','args':(),'kwargs':{'reason':'known broken','raises':None,'run':True,'strict':False}}]`, no `__rustest_skip__`, no `pytestmark`. Neither `xfail` nor `XFail` appears anywhere in src/*.rs (verified by grep), so the executor cannot represent the outcome: the --report-json summary schema is literally {total, passed, failed, skipped, duration} with no xfailed/xpassed bucket. v1's own compat layer admits the gap in prose -- python/rustest/compat/pytest.py:539-542, in RequestFixture.applymarker: 'Store xfail marker for potential later handling / For now, just add it to the node - the test will run normally'. The `run=False` and `strict=True` kwargs are likewise collected and unused. Fix in Phase 1: add xfailed/xpassed outcomes to the report model, run xfail-marked tests and convert their failure to xfailed (honoring raises/run/strict), and keep xfailed out of the failure count so the exit code stays 0."
