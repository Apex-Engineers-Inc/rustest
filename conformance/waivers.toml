# Documented divergences between pytest and rustest v1.
# Every entry MUST have a reason. v2 phase gates shrink this file.
#
# THIS LEDGER DOES NOT SHRINK AT THE 1b.2 GATE, and that is deliberate: v1 is still the
# shipping runner, and every bug below is still present in it. What changed at 1b.2 is
# that all nine are demonstrably FIXED IN V2 -- each entry now names the commit that
# fixed it and the gate that proves it. The ledger that shrank is the v2 pair
# (waivers-v2-collect.toml and waivers-v2-run.toml), both of which are now EMPTY.
# These entries are deleted wholesale when v1 is deleted, not one at a time.
#
# Gate: `uv run python -m conformance`
# Scoreboard at 1b.2: 23 cases -- 14 match, 9 waived, 0 stale-waivers, 0 diverged.
# Scoreboard at 1c.2: 27 cases -- 17 match, 10 waived, 0 stale-waivers, 0 diverged.
#   The four 1c Task 2 additions land 3 MATCH / 1 WAIVED here: collection/dupe-args,
#   fixtures/session-scope and fixtures/module-param-reorder all match (the last two
#   only because the v1 gate compares ids as a SET and cannot see an ordering or a
#   per-file scope defect at all -- see their v2 ledger entries), and marks/pytest-exit
#   is the one real v1 divergence.
[cases]
"collection/class-collection" = "v1 collects test methods on classes that define __init__; pytest refuses them (PytestCollectionWarning: 'cannot collect test class ... because it has a __init__ constructor') because it cannot safely instantiate them per test. v1 instantiates the class anyway and runs the method, so TestWithInit::test_ignored is both an extra ID and an extra failure. The audit flagged class-with-__init__ handling as unverified; this run confirms it diverges. Pre-waiver detail: extra in rustest: ['test_classes.py::TestWithInit::test_ignored']; outcomes pytest=1/0/0/0 rustest=1/1/0/0; exit codes pytest=0 rustest=1. FIXED IN V2 by 159ff4c (feat(v2): python worker — real module identity and pytest-rule enumeration), which ports pytest's collectability rules into python/rustest/_v2_worker.py and refuses a class with a non-object __init__. PROVEN: MATCH under both `python -m conformance --v2-collect` and `python -m conformance --v2-run`."

"collection/empty-suite" = "DIVERGE on exit code only (ids and outcome counts agree, both empty): pytest exits 5 ('no tests ran') when a directory has zero collectible tests; rustest exits 0. Mechanism: python/rustest/cli.py:200-209 special-cases only report.collection_errors (-> 2) and report.failed > 0 (-> 1); with both empty/zero it falls through to the trailing `else: return 0`, which has no branch for pytest's 'nothing was collected' outcome. Verified directly, bypassing the harness: in this case dir, `python -m pytest -q --tb=no .` prints 'no tests ran in 0.06s' and exits 5; `python -m rustest . --pytest-compat --color never` prints 'No tests collected' / '0 tests' and exits 0. Waived under the v2 exit-code contract (spec: 'Contracts are pytest's: exit codes 0-5', docs/superpowers/specs/2026-07-25-rustest-v2-architecture-design.md:38). FIXED IN V2 by 051b9c5 (feat(v2): execute orchestration, selection expressions, --v2 CLI), which encodes the zero-collected branch as src/v2/execute.rs::exit_code -- a four-line port of _pytest/main.py::_main whose ordering (2 > 1 > 5 > 0) was probed against pytest 8.4.2 across 23 shapes before it was written. PROVEN: MATCH at 5/5 under both v2 gates."

"collection/unittest-basic" = "NEW-BUG: v1 grades every unittest.TestCase outcome as PASSED. src/discovery.rs:1681 create_unittest_method_runner emits `def run_test(): test_instance = test_class('<method>'); test_instance()`. TestCase.__call__ aliases TestCase.run(), which builds its own TestResult, records failure/error/skip into it, and RETURNS it instead of raising. v1 discards that return value, so run_test() always completes normally and self.assertEqual(1, 2) grades as passed (verified: failures, errors and skips are all swallowed). This is a silent-failure bug -- a migrated unittest suite reports green while genuinely failing -- not merely a collection gap. Pre-waiver detail: outcomes pytest=1/1/0/0 rustest=2/0/0/0; exit codes pytest=1 rustest=0. FIXED IN V2 by 0a975de (feat(v2): worker execution — type-identity outcomes, unittest translation, mark semantics), which runs each case against an explicit TestResult and re-raises failures/errors while translating skips, plus 511fbc4 for runTest parity. PROVEN: MATCH under `python -m conformance --v2-run` -- v2 reports the failing case as failed and exits 1, exactly as pytest does. GitHub: #129"

"fixtures/autouse" = "NEW-BUG: v1 loads conftest.py TWICE as two independent module objects, so state written by a conftest-level fixture is invisible to a test that does `from conftest import ...`. Autouse mechanics themselves are CORRECT -- a probe confirmed the autouse fixture body runs before the test and appends to its own module's list. The defect is module identity: src/discovery.rs:711 load_conftest_fixtures calls infer_module_names(path, module_ids.next()) (line 717); for a conftest.py in a directory with no __init__.py, infer_module_names (src/discovery.rs:2281) takes the components.len() == 1 branch and returns the synthetic name `rustest_module_N` (src/discovery.rs:2304). load_python_module then registers the module in sys.modules under THAT synthetic key (src/discovery.rs:2275) and never under `conftest`. So the autouse fixture closure appends to rustest_module_0.applied, while the test's `from conftest import applied` finds no `conftest` in sys.modules and re-imports conftest.py from disk as a second module whose `applied` is still empty. Probe output: fixture list id ...566656 len 1 vs imported list id ...632640 len 0 -- distinct objects. pytest (default importmode=prepend) inserts the conftest basedir on sys.path and imports it under its real basename, so exactly one `conftest` instance exists and is shared. Pre-waiver detail: outcomes pytest=1/0/0/0 rustest=0/1/0/0; exit codes pytest=0 rustest=1. FIXED IN V2 by 159ff4c (feat(v2): python worker — real module identity and pytest-rule enumeration): python/rustest/_v2_worker.py::import_test_module imports each file under its real dotted name via importlib.import_module and reuses the sys.modules entry -- its docstring names this 'the #130 fix' -- with the conftest chain itself wired up by 3d6a346 (feat(v2): worker fixture engine). PROVEN: MATCH under `python -m conformance --v2-run`. GitHub: #130"

"marks/bare-marks" = "PARTIAL FIX, residual v1 gap (added at 1b.2 Task 6, with the #136/#137 fix). The case pins the BARE (uncalled) decorator forms `@pytest.mark.skip`, `@pytest.mark.skipif` and `@pytest.mark.xfail` against their called controls. pytest 8.4.2: `1 passed, 4 skipped, 2 xfailed`, exit 0. v1 now: 1 passed / 4 failed / 2 skipped, exit 1. WHAT THE FIX REPAIRED, INCLUDING IN V1: before it, this exact file collected only FIVE of its seven tests under v1 -- `missing from rustest: [test_bare_marks.py::test_bare_skipif, test_bare_marks.py::test_bare_xfail]`, outcomes 1/3/1/0 -- and `test_bare_skip` FAILED with `ValueError: Unknown fixture 'func'` because its body had been replaced by skip_decorator's inner closure (#136). Both v2 gates diverged identically on the two missing ids (#137: exit 0 with a test silently absent). After the fix v1 collects all SEVEN, `test_bare_skip` SKIPS, and the id sets agree -- the divergence is now on outcome COUNTS ONLY, with nothing missing from either side. Both v2 gates MATCH. WHAT REMAINS, AND WHY IT IS NOT THIS DEFECT: the four v1 failures are `test_bare_skipif`, `test_called_skipif`, `test_bare_xfail` and `test_called_xfail` -- note that each bare form now behaves EXACTLY like its called control, which is precisely what 'the bare/called discrimination is fixed' means. What is left is v1's pre-existing mark CONSUMPTION gaps, already waived on their own cases and unchanged by this task: (a) v1 never reads skipif at all, the marks/skip-and-skipif mechanism (GitHub #131) -- `skipif` appears zero times in src/*.rs, so both skipif'd bodies run and raise; (b) v1 has no xfail outcome, the marks/xfail mechanism -- the v1 --report-json summary schema is literally {total, passed, failed, skipped, duration} with no xfailed bucket, so both xfail bodies grade as hard failures. Fixing either here would mean building xfail and skipif into the v1 Rust executor, which is the work v2 exists to replace. Pre-waiver detail: outcomes pytest=1/0/4/0 rustest=1/4/2/0; exit codes pytest=0 rustest=1. NOTE ON BARE SKIPIF: pytest does NOT error on a `skipif` with no condition -- _pytest/skipping.py::evaluate_skip_marks l. 177-179 treats a conditionless skipif as UNCONDITIONAL and skips (reason 'Skipped'), verified by running pytest 8.4.2. rustest matches: the bare form stores Mark('skipif', (), {}) and _v2_worker::_conditions returns the empty positional args. FIXED IN V2 by this task's commit: the discrimination now lives in decorators.py::_mark_decoration_target (python/rustest/decorators.py:519), a verbatim port of _pytest/mark/structures.py::MarkDecorator.__call__, used by decorators.py::BareOrFactoryMark (python/rustest/decorators.py:568) for skipif/xfail/usefixtures/custom marks and by compat/pytest.py:687 for skip. PROVEN: MATCH under BOTH `python -m conformance --v2-collect` (7/7 ids) and `python -m conformance --v2-run` (1 passed / 4 skipped / 2 xfailed, exit 0), byte-for-byte with pytest. GitHub: #136, #137"

"marks/deselect-all" = "DIVERGE on exit code only (ids and outcome counts agree, both empty): `-m nosuchmark` deselects the case's only test (`@pytest.mark.smoke`), which pytest treats the same as zero collected tests -- exit 5, '1 deselected'. rustest exits 0 for the identical invocation. Same mechanism as collection/empty-suite: python/rustest/cli.py:200-209 special-cases only report.collection_errors (-> 2) and report.failed > 0 (-> 1), with no branch for 'nothing selected/collected', so zero/zero falls through to `else: return 0`. Verified directly, bypassing the harness: in this case dir, `python -m pytest -q --tb=no -m nosuchmark .` prints '1 deselected in 0.04s' and exits 5; `python -m rustest . --pytest-compat --color never -m nosuchmark` prints 'No tests collected' / '0 tests' and exits 0. Waived under the v2 exit-code contract (spec: 'Contracts are pytest's: exit codes 0-5', docs/superpowers/specs/2026-07-25-rustest-v2-architecture-design.md:38); tracked as the same CLI exit-code gap as collection/empty-suite, not a separate defect. FIXED IN V2 by 051b9c5, which counts collected tests AFTER deselection before applying src/v2/execute.rs::exit_code -- probe rows 11 and 12 of the Task 4 exit-code table are `-k nomatch` and `-m nosuchmark` respectively, both exit 5. PROVEN: MATCH at 5/5 under both v2 gates."

"marks/skip-and-skipif" = "NEW-BUG: v1 honors @pytest.mark.skip but ignores @pytest.mark.skipif on the decorator path (RequestFixture.applymarker at compat/pytest.py:529-537 does honor it at runtime), so a skipif'd test RUNS its body. Not predicted by the audit, which expected only xfail to diverge here. pytest: `1 passed, 2 skipped` exit 0; rustest: 1 passed / 1 failed / 1 skipped exit 1, with test_skipped_conditionally executing `raise AssertionError('must not run')` and grading as a real failure. The two marks travel different paths. skip: _PytestMarkCompat.skip (python/rustest/compat/pytest.py:704, a property since the #136/#137 fix; it was a plain method at the time this waiver was written) routes to rustest.decorators.skip_decorator (python/rustest/decorators.py:252), which sets the `__rustest_skip__` attribute (python/rustest/decorators.py:260); Rust reads that attribute in collect_tests (src/discovery.rs:1178) into TestCase.skip_reason and execution.rs:594 short-circuits the test as skipped -- this works. skipif: _PytestMarkCompat.skipif (python/rustest/compat/pytest.py:712) is only a property delegating to MarkGenerator.skipif, which since the #136/#137 fix is a BareOrFactoryMark (python/rustest/decorators.py:568) wrapping MarkGenerator._skipif (python/rustest/decorators.py:809) and still returns MarkDecorator('skipif', (condition,), ...) for the called form; MarkDecorator.__call__ (python/rustest/decorators.py:491-506) ONLY appends the mark dict to `__rustest_marks__` (line 505) -- it never sets `__rustest_skip__` and never sets `pytestmark`. Attribute probe on the case module confirms: test_skipped -> `__rustest_skip__='always skipped'`, no marks; test_skipped_conditionally -> `__rustest_marks__=[{'name':'skipif','args':(True,),'kwargs':{'reason':'condition true'}}]`, `__rustest_skip__` absent, `pytestmark` absent. On the Rust side the only remaining skip source, check_for_pytest_skip_mark (src/discovery.rs:2015-2056), reads the `pytestmark` attribute (line 2023) and matches only `name == \"skip\"` (line 2039); it never inspects `__rustest_marks__` and has no skipif branch. collect_marks (src/discovery.rs:2142) does collect the mark, but the literal `skipif` appears ZERO times anywhere in src/*.rs OUTSIDE src/v2/ (verified by grep; the claim is about the v1 engine and was written before src/v2/ existed -- v2 evaluates skipif in the worker, not in Rust, so the v1 statement remains true where it is scoped), so the collected mark is inert. Note the CONDITION is evaluated correctly -- MarkDecorator._normalize_args (python/rustest/decorators.py:508-513) stores args=(True,) for the true condition and (False,) for the false one -- so the fix is consumption, not evaluation. Severity: a platform guard like @skipif(sys.platform=='win32') executes anyway, so migrated suites run tests they explicitly excluded. Pre-waiver detail: outcomes pytest=1/0/2/0 rustest=1/1/1/0; exit codes pytest=0 rustest=1. FIXED IN V2 by 0a975de (feat(v2): worker execution — ... mark semantics), which reads all three mark sources (pytestmark, __rustest_marks__, __rustest_skip__) into MarkSpecs at collection and evaluates them at EXECUTE time in python/rustest/_v2_worker.py::evaluate_skip_marks, where pytest evaluates them (_pytest/skipping.py::pytest_runtest_setup). PROVEN: MATCH under `python -m conformance --v2-run` at 1 passed / 2 skipped, exit 0. GitHub: #131"

"marks/xfail" = "PREDICTED and CONFIRMED: v1 has no xfail outcome at all, so an expected failure grades as a hard failure and flips the exit code. pytest: `1 passed, 1 xfailed` exit 0; rustest: 1 passed / 1 failed exit 1 (test_xfail.py::test_expected_failure -> status 'failed' in --report-json). Mechanism: pytest.mark.xfail (python/rustest/compat/pytest.py:717) is a property delegating to MarkGenerator.xfail (a BareOrFactoryMark over MarkGenerator._xfail, python/rustest/decorators.py:841, since the #136/#137 fix), which returns MarkDecorator('xfail', args, kwargs) and therefore only appends to `__rustest_marks__` (python/rustest/decorators.py:505). Probe confirms: test_expected_failure -> `__rustest_marks__=[{'name':'xfail','args':(),'kwargs':{'reason':'known broken','raises':None,'run':True,'strict':False}}]`, no `__rustest_skip__`, no `pytestmark`. Neither `xfail` nor `XFail` appears anywhere in src/*.rs OUTSIDE src/v2/ (verified by grep; scoped because src/v2/execute.rs::TestStatus now has XFailed/XPassed variants -- the claim is about the v1 engine), so the executor cannot represent the outcome: the v1 --report-json summary schema is literally {total, passed, failed, skipped, duration} with no xfailed/xpassed bucket. v1's own compat layer admits the gap in prose -- python/rustest/compat/pytest.py:539-542, in RequestFixture.applymarker: 'Store xfail marker for potential later handling / For now, just add it to the node - the test will run normally'. The `run=False` and `strict=True` kwargs are likewise collected and unused. Pre-waiver detail: outcomes pytest=1/0/0/0 rustest=1/1/0/0; exit codes pytest=0 rustest=1. NOTE ON THE COUNTS: pytest's xfailed test lands in none of the four buckets the v1 gate compares. That used to be an artifact of the harness -- conformance/harness/runners.py's _SUMMARY_RE did not carry the `xfailed` token at all -- and is now a deliberate scope limit: the parser reads all six buckets (Task 5), but grade_case still diffs the four v1 can represent, because v1 has no xfail concept to diff against. The v2-run gate diffs all six. FIXED IN V2 by 0a975de (feat(v2): worker execution — ... mark semantics): python/rustest/_v2_worker.py::evaluate_xfail_marks honours reason/raises/run/strict, and 051b9c5 gave the wire and the report their own xfailed/xpassed buckets with TestStatus::is_failure excluding both. PROVEN: MATCH under `python -m conformance --v2-run` at 1 passed / 1 xfailed, exit 0."

"marks/xfail-strict" = "PREDICTED and CONFIRMED (added at 1b.2 Task 5): v1 has no xfail outcome, and therefore no strict xfail either, so a test marked `@pytest.mark.xfail(strict=True)` whose body PASSES is graded as an ordinary pass where pytest grades it as a hard failure. pytest: `1 failed, 1 xfailed` exit 1; rustest v1: 1 passed / 1 failed exit 1. Pre-waiver detail: outcomes pytest=0/1/0/0 rustest=1/1/0/0 -- and NOTE that the exit codes AGREE (1 on both sides) purely by accident, because the sibling test_strict_xfail fails hard under v1 and supplies the 1. A case containing only the strict xpass would diverge on the exit code as well (pytest 1, v1 0), which is what makes this shape worth its own case: the failure is INVISIBLE to an exit-code-only check. Mechanism: identical to marks/xfail -- _PytestMarkCompat.xfail (python/rustest/compat/pytest.py:717) delegates to MarkGenerator.xfail (a BareOrFactoryMark over MarkGenerator._xfail, python/rustest/decorators.py:841, since the #136/#137 fix), which stores `strict` in the mark kwargs and nothing in src/*.rs ever reads it; the docstring for that parameter says 'If True, passing test will fail the suite', which v1 does not implement. pytest's own rule is in _pytest/skipping.py::pytest_runtest_makereport: a strict xpass is rewritten to rep.outcome = 'failed' with the message prefix '[XPASS(strict)] ' BEFORE it is counted, so it never reaches the xpassed bucket. FIXED IN V2 by 0a975de: python/rustest/_v2_worker.py:3063-3064 sends outcome 'failed' with the '[XPASS(strict)] ' prefix for a strict xpass, and src/v2/protocol.rs:151-152 documents that a strict xpass is deliberately NOT in the xpassed status set. PROVEN: MATCH under both v2 gates -- `--v2-run` reports 1 failed / 1 xfailed, exit 1, byte-for-byte with pytest."

"marks/pytest-exit" = "PREDICTED and CONFIRMED (added at 1c Task 2): `pytest.exit()` called from inside a test body is a SILENT NO-OP in the compat shim, so the session does not stop and every test after the call runs. pytest 8.4.2 raises `Exit` (not `Interrupted`) from `_pytest/outcomes.py::exit`; `wrap_session` catches it, stops the session where it stands, keeps the reports already produced and returns exit 2. Probed: `1 passed` and exit 2, with `test_never` never executed. rustest v1: 2 passed / 1 failed, exit 1 -- `test_bails` PASSES (the call did nothing) and `test_never` then runs and raises its deliberate AssertionError. MECHANISM: `pytest.exit` is not defined in python/rustest/compat/pytest.py at all, so it falls through to that module's catch-all `__getattr__` (python/rustest/compat/pytest.py:1019), which manufactures and caches a do-nothing STUB CLASS for any unknown public attribute -- its `stub_init` has an empty body. `pytest.exit('stopping here')` therefore constructs a `<exit (rustest compat stub)>` instance, returns it, and the test body completes normally. The stub table exists so that plugins can IMPORT pytest internals without exploding, which is a reasonable thing to want; the cost is that a *called* control-flow function silently succeeds. SEVERITY: this is the silent-false-green class -- the same class as #129 (unittest outcomes swallowed) and the async false-green fixed at 1c Task 1 -- because the run stays GREEN on the bail-out itself and only reports whatever the tests that should never have run happen to do. NOT FIXED HERE, deliberately: honest parity needs a session-stop signal on the worker wire (a new op, so PROTOCOL_VERSION and a mutation harness), and the cheap half-fix -- making the stub raise -- would change the FROZEN v1 shim's behaviour for every attribute users reach through it while still diverging from pytest (an error, not a stop). Recommended as a standalone task; the corpus case is the pin that keeps it from being forgotten. Pre-waiver detail: outcomes pytest=1/0/0/0 rustest=2/1/0/0; exit codes pytest=2 rustest=1; collection-error pytest=True rustest=False -- the last of those is the v1 gate INFERRING a collection error from pytest's exit 2, which is exactly the Interrupted/Exit conflation that P1b.2 Task 5 Sec 10.2 rekeyed the run gate's nothing-ran rule to avoid; the v1 gate has no collect pass to key on, so it is recorded here rather than fixed."
