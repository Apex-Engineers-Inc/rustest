# Documented divergences between pytest and rustest v1.
# Every entry MUST have a reason. v2 phase gates shrink this file.
[cases]
"collection/class-collection" = "v1 collects test methods on classes that define __init__; pytest refuses them (PytestCollectionWarning: 'cannot collect test class ... because it has a __init__ constructor') because it cannot safely instantiate them per test. v1 instantiates the class anyway and runs the method, so TestWithInit::test_ignored is both an extra ID and an extra failure. The audit flagged class-with-__init__ handling as unverified; this run confirms it diverges. Fixed by v2 collection rules (spec: python_classes / class collectability)."

"collection/unittest-basic" = "NEW-BUG: v1 grades every unittest.TestCase outcome as PASSED. src/discovery.rs:1681 create_unittest_method_runner emits `def run_test(): test_instance = test_class('<method>'); test_instance()`. TestCase.__call__ aliases TestCase.run(), which builds its own TestResult, records failure/error/skip into it, and RETURNS it instead of raising. v1 discards that return value, so run_test() always completes normally and self.assertEqual(1, 2) grades as passed (verified: failures, errors and skips are all swallowed). This is a silent-failure bug -- a migrated unittest suite reports green while genuinely failing -- not merely a collection gap. Fix in Phase 1: run the case against an explicit TestResult, re-raise failures/errors and translate skips to skipped."

"fixtures/autouse" = "NEW-BUG: v1 loads conftest.py TWICE as two independent module objects, so state written by a conftest-level fixture is invisible to a test that does `from conftest import ...`. Autouse mechanics themselves are CORRECT -- a probe confirmed the autouse fixture body runs before the test and appends to its own module's list. The defect is module identity: src/discovery.rs:711 load_conftest_fixtures calls infer_module_names(path, module_ids.next()) (line 717); for a conftest.py in a directory with no __init__.py, infer_module_names (src/discovery.rs:2281) takes the components.len() == 1 branch and returns the synthetic name `rustest_module_N` (src/discovery.rs:2304). load_python_module then registers the module in sys.modules under THAT synthetic key (src/discovery.rs:2275) and never under `conftest`. So the autouse fixture closure appends to rustest_module_0.applied, while the test's `from conftest import applied` finds no `conftest` in sys.modules and re-imports conftest.py from disk as a second module whose `applied` is still empty. Probe output: fixture list id ...566656 len 1 vs imported list id ...632640 len 0 -- distinct objects. pytest (default importmode=prepend) inserts the conftest basedir on sys.path and imports it under its real basename, so exactly one `conftest` instance exists and is shared. Effect here: 1 passed (pytest) vs 1 failed (rustest), exit 0 vs 1. Fix in Phase 1: derive conftest/test module names from the file basename the way pytest does and reuse any existing sys.modules entry, so `import conftest` from a test yields the same module object the fixtures were collected from."
