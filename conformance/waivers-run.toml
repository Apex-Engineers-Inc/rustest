# Documented divergences between a real pytest run and `rustest --v2`.
#
# This is the Phase 1b.2 full-run gate's ledger, kept separate from waivers.toml (the
# v1 end-to-end ledger) and waivers-collect.toml (the v2 collection ledger) because
# an entry in one says nothing about the others. `collection/unittest-basic` is waived
# for v1 (#129: every unittest outcome graded PASSED), matches under v2-collect, and
# matches here; `marks/xfail-strict` is waived for v1 (no xfail concept at all) and
# matches under both v2 gates.
#
# Graded: the ORDERED node ids the schema-v2 report carries, the six-value outcome
# tally (passed/failed/skipped/xfailed/xpassed/error), and the process exit code.
# Nothing else -- stdout and stderr prose differ from pytest's by design, and worker
# stderr legitimately carries boundary teardown output on a green run.
#
# Every entry MUST carry the mechanism and a file:line. Phase gates shrink this file;
# a waiver whose case starts matching is reported as a STALE-WAIVER and fails the run.
#
# Gate: `uv run python -m conformance --run`
# Scoreboard at 1b.2: 23 cases -- 23 match, 0 waived, 0 stale-waivers, 0 diverged.
# Scoreboard at 1c.2: 27 cases -- 24 match, 3 waived, 0 stale-waivers, 0 diverged.
# Scoreboard at P3.1: 32 cases -- 28 match, 4 waived, 0 stale-waivers, 0 diverged.
# Scoreboard at P3.2: 34 cases -- 30 match, 4 waived, 0 stale-waivers, 0 diverged.
#   The two Phase 3 Task 2 additions (conformance/corpus/builtins/*) both MATCH: fd-level
#   capfd and pytest-faithful caplog levels landed with the builtins they belong to.
#   Four of the five Phase 3 Task 1 async additions MATCH; the fifth, async/mode-default,
#   is the ONLY DELIBERATE entry in this file -- a default rustest chose differently, with
#   every semantic rule of the option ported and matching. See its entry below.
#
# THIS FILE WAS EMPTY AT 1b.2 AND IS NO LONGER. All three entries below arrived with the
# four 1c Task 2 corpus additions: they are shapes the 1b.2 corpus did not contain, not
# regressions in anything it did. Each was adjudicated on probed evidence and names its
# own fix shape. The fourth addition, collection/dupe-args, MATCHES.
#
# The 1b.2 headline it replaces is still true of the cases it was about: every execution
# divergence the corpus found in v1 -- #129 (unittest outcomes swallowed), #130 (conftest
# loaded twice), #131 (skipif ignored), xfail with no outcome to put it in, strict xfail,
# and the missing exit-5 branch in two cases -- is fixed in v2.
# `test_run_ledger_holds_only_adjudicated_waivers` in conformance/tests/test_main.py
# enforces that a new entry still cannot appear quietly: the set is asserted by name.
[cases]

"fixtures/session-scope" = "PARTLY FIXED (Phase 4c). The defect this case was ADDED for -- session scope with a granularity of one FILE -- is CLOSED, and what remains is the cross-WORKER split the architecture has always owned, so the entry is rewritten rather than deleted and the case still fails the ordered-id/tally comparison at the default pool. WAS (1c Task 2): a session-scoped conftest fixture requested by two sibling files was set up TWICE EVEN AT -n 1 -- one worker, both files -- because build_registry rebuilt the conftest chain's FixtureDef objects per file while FixtureRunner._cache keys on FixtureDef IDENTITY (@dataclass(eq=False), deliberately, so it keys the way pytest keys off its own FixtureDef). Two files presented two keys for one fixture, the cache missed, and a yield teardown was queued once per file as well. NOW: python/rustest/_worker.py::conftest_fixturedefs caches each conftest's FixtureDef objects per worker, keyed by (path, sha256 of its bytes), and build_registry composes them into a fresh per-file container. MEASURED ON THIS CASE: `rustest --v2 -n 1` was 1 passed / 1 failed / exit 1 and is now 2 passed / exit 0 -- pytest's answer exactly. WHAT IS LEFT, and why the gate still sees red: a worker is handed a SUBSET of the run's files (src/engine/collect.rs routes by a hash of the file stem) and `workers` is clamped to the file count, so a TWO-file case at the default pool is split across two worker PROCESSES and no worker-level fix can make them share a Python object. This is the same residue async/session-loop-shared measures for the session event LOOP, and closing it means giving the orchestrator cross-worker session scope -- a scheduler change, not a worker change. THE CORPUS CANNOT EXPRESS THE HALF THAT IS FIXED, and that is a property of the instrument, not an excuse: a gate case is graded at the default pool, so any cross-file session assertion is a cross-worker assertion. Adding a case that passes at the default pool would certify a vacuous MATCH. The per-worker contract is therefore pinned against ONE worker in the self-suite -- python/tests/test_worker_execute.py (one instance across two files, narrower scopes still per file, LIFO teardown across the worker's whole history, the #4871 dependent cascade across a file boundary), python/tests/test_worker_fixtures.py (chain-mismatch safety in both directions, cross-chain sharing of a rootdir conftest, byte-identical-or-rebuild) and python/tests/test_worker_asyncio.py (an async session fixture across a file boundary). Seven of those eleven were confirmed to FAIL with the two caches neutralised. Pre-waiver detail: outcomes (passed/failed/skipped/xfailed/xpassed/errors/deselected) pytest=2/0/0/0/0/0/0 v2=1/1/0/0/0/0/0; exit codes pytest=0 v2=1."

"marks/pytest-exit" = "PARTLY FIXED (1c Task 1 fix wave) -- the divergence this case was added for is CLOSED and what is left is a grading asymmetry, so read the detail line before deleting the entry. WAS: `pytest.exit()` was a silent no-op in the compat shim, so `--v2` reported 2 passed / 1 failed at exit 1 where pytest reports 1 passed at exit 2 -- the silent-false-green class. NOW: `compat/pytest.py::exit` raises a real `Exit` (port of `_pytest/outcomes.py::exit`); the worker lists it in `ABORT_EXCEPTIONS` so no phase handler can classify it as a test outcome, writes pytest's `Exit: <reason>` banner to stderr, and exits `SESSION_EXIT_EXIT` (4). `src/engine/collect.rs::Worker::execute_died` reads that code into `CollectError::SessionExit` and `src/engine/execute.rs::worker_life` intercepts it: the worker's already-reported results are KEPT, the pool stops dispatching, and `exit_code` returns 2 -- pytest's `INTERRUPTED`, which `wrap_session` sets for `Exit` ahead of `testsfailed` (probed: a file whose first test fails and whose second calls `pytest.exit()` reports `1 failed` and exits 2, not 1). Measured on this case: OUTCOME TALLY AND EXIT CODE NOW MATCH PYTEST EXACTLY (1 passed, exit 2, `test_never` never executed). THE RESIDUAL is the id comparison, and it is an artifact of what the two sides mean by 'ids': the harness takes pytest's id list from the COLLECT pass (3 ids -- everything collected) and v2's from the run report's `tests` (1 id -- everything that produced a result). Under a truncated session those differ by construction, for pytest too; pytest's own run simply has no machine-readable per-test list for the harness to read. The same asymmetry would appear for any `-x` case. Grading a truncated run needs the harness to compare v2's COLLECTED ids (which do match: the `--collect` gate MATCHES this case at 3/3) rather than its reported ones -- a harness change, deliberately not made inside a fix wave that owns the worker and CLI surfaces. ALSO RESIDUAL, and out of this case's reach: `pytest.exit(returncode=N)` is not honoured (the worker exit code is the whole channel and carries no payload, which is what keeps PROTOCOL_VERSION unchanged), and a `pytest.exit()` at IMPORT time surfaces as an orchestration failure at exit 3 rather than 2 -- `src/engine/py.rs` classifies `SessionExit` as internal because the collection phase has no results to keep and no channel to say otherwise. Both need the session-stop signal on the wire."

"fixtures/module-param-reorder" = "PREDICTED and CONFIRMED (added at 1c Task 2): v2 does not implement pytest's reorder_items pass, so a module-scoped PARAMETRIZED fixture requested by two tests is emitted -- and executed -- in source order instead of grouped by parameter. pytest: alpha[one], beta[one], alpha[two], beta[two]. v2: alpha[one], alpha[two], beta[one], beta[two]. MECHANISM: _pytest/fixtures.py::reorder_items runs as part of pytest_collection_modifyitems and needs the WHOLE session's item list to group by the higher-scoped parameter; v2 collects file by file in a worker pool and has no such pass -- the limitation is already written down at python/rustest/_worker.py:97-102, which predicted exactly this outcome: a module-scoped two-value fixture costs 2 setups under pytest (grouped) and 4 here. Both halves PROBED with a printing fixture: pytest 2 setups (SETUP one, SETUP two), v2 4 (SETUP one, SETUP two, SETUP one, SETUP two). WHAT THE GATE ACTUALLY SEES, and why the case earns its place: the TALLY MATCHES -- 4 passed on both sides, exit 0 on both sides -- and the id SETS are identical. The divergence is visible ONLY through the ordered id comparison. A set-based or tally-based grader certifies this green, which is precisely what happens on the v1 gate, where this case MATCHES. That makes it the corpus's demonstration that ordered ids are load-bearing rather than pedantic. It is also a real behavioural cost, not a cosmetic one: double the fixture setups, paid in full by any fixture whose setup is expensive or non-idempotent. DEFERRED to the Phase 2/3 decision on item reordering (1c Task 1 report Sec 8, behavioural gap 9): the pass needs the manifest assembled before dispatch, which is a scheduler change, not a worker change. Pre-waiver detail: id order: first divergence at index 1 (pytest='test_module_param_reorder.py::test_beta[one]', v2='test_module_param_reorder.py::test_alpha[two]')."

"async/mode-default" = "BY DESIGN, and the case exists to measure it rather than to hide it (added at Phase 3 Task 1). With NOTHING configured -- a bare `[pytest]` ini -- an unmarked `async def` test FAILS under pytest and PASSES under rustest. pytest: 1 passed / 1 failed, exit 1. rustest --v2: 2 passed, exit 0. MECHANISM, and it is a one-line difference in a default, not in a rule: pytest-asyncio declares `addini(\"asyncio_mode\", ..., default=\"strict\")` (pytest_asyncio/plugin.py l. 106-110), so an async function is not converted into its item class, falls through to `_pytest/python.py::pytest_pyfunc_call` and is failed by `async_fail` (l. 137-159) -- probed, `async def functions are not natively supported`. rustest defaults to `auto` (`src/engine/config.rs::DEFAULT_ASYNCIO_MODE`, which carries the full argument). WHY THE DEFAULT DIFFERS: pytest-asyncio's own help text says strict exists \"for autoprocessing disabling (useful if different async frameworks should be tested together, e.g. both pytest-asyncio and pytest-trio are used in the same project)\" (l. 82-87) -- it is a COEXISTENCE default for one installable plugin among several. rustest has no async-plugin ecosystem and no way to be uninstalled: `asyncio_mode = strict` is how a rustest suite turns async support OFF. Shipping strict as the default would ship the runner with its own documented feature disabled (docs/guide/async-testing.md: \"Rustest provides built-in support for testing asynchronous code\") and would answer an unmarked async test with advice to install pytest-asyncio -- addressed to someone already running its replacement. WHAT IS NOT WAIVED, and this is the point of the entry: every SEMANTIC rule of the option is ported and MATCHES. `async/mode-strict` sets `asyncio_mode = strict` explicitly and matches at 6/6 -- including the two shapes that make strict observable (an unmarked async test and an unmarked async GENERATOR test both fail through `async_fail`, and a plain `@pytest.fixture async def` hands the test a coroutine object rather than being awaited). `async/session-loop-shared`, `async/loop-scope-override` and `async/asyncgen-session-fixture` all set `asyncio_mode = auto` explicitly and all match. So the divergence is confined to suites that configure nothing, it is one ini line to erase in either direction, and any suite that has ever run under pytest-asyncio has the line already. Pre-waiver detail: outcomes (passed/failed/skipped/xfailed/xpassed/errors/deselected) pytest=1/1/0/0/0/0/0 v2=2/0/0/0/0/0/0; exit codes pytest=1 v2=0."
"async/session-loop-shared" = "THE ROUTING CHANGED, AND THE CASE'S OWN README PRE-AUTHORISED THIS ENTRY: \"Should that routing change, this case turns red and the ledger entry belongs in waivers-run.toml alongside [fixtures/session-scope] -- it is not a reason to weaken the assertion.\" MECHANISM: a session-scoped event loop is per WORKER, not per run, because a worker is handed a subset of the files and `python/rustest/_worker.py`'s FixtureRunner caches the loop for its own process only -- see also the files (`src/engine/collect.rs::worker_for`, stem-hash routing) -- the same per-worker boundary already waived for session *fixtures*. The case matched until Phase 4 Task 1's review only because both files happened to draw the same worker; that draw moved when markdown stopped being collected on a directory walk, which removed this directory's `README.md` from the target list and so changed the pool size the stems are hashed against. Verified: `-n 1` gives 3 passed (one loop, three tests); `-n 2` gives 1 failed, and the failing assertion is `len(_loops.SEEN) == 3` seeing 1 -- i.e. two interpreters, not two loops in one. NOT weakened and NOT pinned to `-n 1`: the case is the standing measurement of a real limitation, and closing it means giving the orchestrator cross-worker session scope. Pre-waiver detail: outcomes pytest=3/0/0/0/0/0/0 v2=2/1/0/0/0/0/0; exit codes pytest=0 v2=1."
