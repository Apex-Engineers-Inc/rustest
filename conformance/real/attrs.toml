# attrs -- KEEP-with-ledgered-hooks (Phase 4 Task 1b batch 2). tests/conftest.py at 26.1.0 is
# the ONLY conftest.py in the repo (33 lines, full text quoted in the audit). One hook,
# `pytest_configure`, whose entire body registers + loads a Hypothesis settings profile
# (`settings.register_profile("patience", ...)`, raises the deadline, suppresses
# `HealthCheck.too_slow`) -- Hypothesis config, not a pytest marker/collection mechanism, and
# it does NOT call `config.addinivalue_line`. Plus two trivial parametrized boolean fixtures
# (`slots`, `frozen`, `params=(True, False)`) and a two-entry `collect_ignore`
# (`test_pattern_matching.py` unless PY_3_10_PLUS, `test_forward_references.py` unless
# PY_3_14_PLUS -- both true on our Python 3.14 pin, so nothing is actually ignored here).
# Squarely LIMITED per the batch-2 rule (marker/config registration + a handful-of-files
# collect_ignore): no pytest_generate_tests, no custom collectors, no plugin registration of
# attrs' own. New domain: class-boilerplate generation, versus schema validation
# (marshmallow), CLI (click), templating (jinja2), WSGI (werkzeug).
#
# One adjacent HEAVY mechanism intentionally NOT counted against this pick: `pytest-mypy-plugins`
# (a custom `.yml`-file collector) only activates for `tests/test_mypy.yml` when that plugin is
# installed, gated to a separate `mypy` tox/dependency-group env outside this draft's `tests`
# testpaths -- not installed here, so it never loads.

[repo]
kind = "oss"
url = "https://github.com/python-attrs/attrs.git"
tag = "26.1.0"
# Annotated + cryptographically signed tag (SSH-signed by hynek); this is the commit it
# resolves to, not the tag object's own SHA.
rev = "7bfc49e9b22d5ba25b6e429524c3d49fee27cb36"
test_paths = ["tests"]

[env]
# [dependency-groups].tests: cloudpickle (CPython-only, pickle-compat regression data),
# hypothesis (drives most edge-case tests; also supplies the conftest's "patience" profile),
# pympler (memory-usage checks in a handful of tests), pytest, pytest-xdist[psutil] (parallel
# execution via `-n auto`, not required for correctness -- left out, same call made for every
# other target in this corpus that only uses a plugin for perf/output shaping).
setup = [
  ["uv", "venv", "--python", "3.14", "{venv}"],
  # Pinned to the SAME pytest the corpus gates use as their oracle (8.4.2).
  ["uv", "pip", "install", "--python", "{py}", "pytest==8.4.2", "hypothesis", "pympler", "cloudpickle"],
  ["uv", "pip", "install", "--python", "{py}", "-e", "{repo}"],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-0.16.2-cp314-cp314-win_amd64.whl",
  ],
]
pythonpath = []

[addopts]
# [tool.pytest.ini_options]: addopts = ["-ra", "--strict-markers", "--strict-config",
# "--import-mode=importlib"]; xfail_strict = true; testpaths = "tests"; filterwarnings =
# ["once::Warning", "ignore:::pympler[.*]"]. No `markers` key at all (consistent with the
# conftest registering none). Same mechanism as click's addopts: rustest applies `addopts`
# itself by reading `[tool.pytest.ini_options]` out of the target's own pyproject.toml (Phase
# 4 Task 1 port of `Config._preparse`), so both runners pick this up automatically -- nothing
# to inject on the command line.
configured = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
replay = []
dropped = []

[run]
pytest_args = []
rustest_args = []
timeout_s = 1800
# MEASURED, not the draft's guess. The draft expected the click/jinja2 IdMaker spelling gap;
# that gap is closed and is NOT what happens here. Exactly 3 of 1387 ids differ, and all 3 are
# a downstream symptom of the length-1-sequence-unpack defect ledgered below -- rustest binds
# a different VALUE, so it then generates a different id from it. `strip_params` is kept for
# that reason: it raises the raw id difference as its own graded `ids` problem (below) instead
# of scattering it across per-id noise, and it goes stale the moment the unpack is fixed. Once
# it is, re-test `exact` here -- on this evidence the suite should reach it.
id_policy = "strip_params"

[divergence.ids]
"tests/test_packaging.py::TestLegacyMetadataHack::*" = """\
NEW MECHANISM (first sighting in this sweep), 4 errors (2 tests x 2 params): the **`recwarn` \
builtin fixture is not implemented**. rustest is honest about it rather than silently \
skipping -- it raises `FixtureLookupError: fixture 'recwarn' is not supported by the rustest \
v2 worker yet`, and helpfully lists what IS supported (tmp_path_factory, tmp_path, \
tmpdir_factory, tmpdir, monkeypatch, capsys, capfd, caplog, cache, mocker, pytestconfig). \
pytest passes all 4. These tests use `recwarn` to assert the DeprecationWarning attrs' legacy \
`__version__`/`__version_info__` metadata hack emits. Reproduces on the one file alone. \
rustest DEFECT (a missing builtin, not a wrong behaviour). PHASE-4-FOLLOWUP."""

"tests/test_validators.py::TestMinLen::test_check_invalid*" = """\
KNOWN MECHANISM, fifth independent sighting: rustest unpacks a length-1 sequence argvalue \
under a SINGLE argname. `@pytest.mark.parametrize("value", ["", list(range(1))])` \
(tests/test_validators.py:1071-1078). `list(range(1))` is `[0]` -- one argname, a length-1 \
list -- so rustest binds `value = 0`, the bare int. attrs' `min_len` validator then calls \
`len(value)` and raises `TypeError: object of type 'int' has no len()` instead of the \
`ValueError` the test expects. The `""` case is unaffected and passes. pytest passes both. \
Same defect as Member Designer / marshmallow / werkzeug; fix is `len(argnames) > 1`. \
PHASE-4-FOLLOWUP."""

[divergence.global]
ids = """\
3 of 1387 raw node ids differ, and all 3 are downstream of the length-1-sequence-unpack defect \
ledgered above -- rustest is generating a correct id for the WRONG VALUE, which is not the \
IdMaker spelling gap click and jinja2 used to carry (that one is closed).

2 of the 3 come from `tests/test_setattr.py::TestSetAttr::test_validator`, and they are the \
sighting that shows this defect also corrupts node ids and not just bound values. \
`@pytest.mark.parametrize("on_setattr", [setters.validate, [setters.validate], \
setters.pipe(setters.validate)])` (tests/test_setattr.py:72-75): the second argvalue is the \
length-1 list `[setters.validate]`, rustest unpacks it to the bare function, that function IS \
IdMaker-representable, so cases 0 and 1 both generate the id `validate` and rustest's \
duplicate resolution renames them `validate0`/`validate1`. pytest keeps the list intact, \
cannot represent it, and ids it `on_setattr1` -- leaving case 0 as plain `validate`. Hence \
pytest `[validate]`/`[on_setattr1]` vs rustest `[validate0]`/`[validate1]`. Both cases still \
PASS on both sides, because for attrs a bare validator and a one-element list of validators \
behave identically -- so here the defect was visible ONLY through the node id, which is \
exactly why this entry is graded rather than absorbed. (It is carried here, not as a per-id \
entry, because under `strip_params` the per-function status multisets match and no per-id \
problem is raised for it.)

The 3rd is `tests/test_validators.py::TestMinLen::test_check_invalid`, whose ledger entry \
above covers it. All 3 go stale the moment unpacking is gated on `len(argnames) > 1`."""
exit_code = """\
rustest exits 1 where pytest exits 0: 4 errors (recwarn) plus 1 failure (length-1 unpack)."""
tally = """\
pytest 1380 passed / 5 skipped / 2 xfailed / 0 failed / 0 error; rustest 1375 passed / 5 \
skipped / 2 xfailed / 1 failed / 4 error. Identical skip and xfail sets. The 5-test delta is \
the 4 `recwarn` errors and the 1 `min_len` failure, both ledgered above.

Two things the pre-clone audit flagged that turned out to be non-events, worth recording \
because they were the reason this pick was classified KEEP-WITH-LEDGERED-HOOKS rather than \
clean: the conftest's `pytest_configure` (which only registers/loads a Hypothesis settings \
profile) and its two-entry `collect_ignore` (both conditions true on the 3.14 pin, so nothing \
is ignored) produce NO divergence at all -- 1387 ids on both sides. The `slots`/`frozen` \
parametrized boolean fixtures likewise agree everywhere."""
