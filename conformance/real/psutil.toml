# psutil -- KEEP (Phase 4 Task 1b batch 2). ZERO conftest.py anywhere in the repo -- confirmed
# by direct listing of every plausible directory (top-level tests/, the psutil/ package dir
# itself, repo root, scripts/). Classification: NONE, as clean as jsonschema's.
#
# All shared test infrastructure lives in tests/__init__.py instead: `class
# PsutilTestCase(unittest.TestCase)` ("All test classes should derive from this one, even if
# we use pytest" -- the project's own docstring), with platform gating done entirely through
# plain `@pytest.mark.skipif(not WINDOWS, ...)`/`@pytest.mark.skipif(PYPY, ...)` decorators on
# per-platform base classes (e.g. `WindowsTestCase`), not hooks. No `pytest_*` function exists
# anywhere in tests/__init__.py either -- confirmed directly, not just inferred from the
# missing conftest.py. No pytest_generate_tests, no custom collectors, no plugin registration
# of psutil's own. `@pytest.mark.parametrize` usage is essentially absent (checked
# test_process.py/test_connections.py/test_misc.py explicitly -- zero occurrences). New
# domain: process/system introspection, versus everything else in the corpus.

[repo]
kind = "oss"
url = "https://github.com/giampaolo/psutil.git"
tag = "v7.2.2"
# psutil pushes two tags per release pointing at the same commit (v7.2.2 and release-7.2.2);
# either resolves identically. Annotated (GitHub's tag page shows an explicit "tagged this"
# attribution line, only rendered for annotated tag objects) -- api.github.com's
# `git/refs/tags` endpoint that would API-verify this was 403-blocked this session; the commit
# below is corroborated via two independent github.com web-UI fetches (tag page + commit
# page), not API-verified. Flag for the implementer to re-verify with `gh api` if it matters.
rev = "9eea97dd6f1d16ea33f5144c8925f1ce7a0688e1"
test_paths = ["tests"]

[env]
# BUILD-REQUIREMENT NOTE, same shape as Pillow's: psutil compiles a real per-platform C
# extension (setup.py `ext_modules`, e.g. `_psutil_windows.c`) -- an editable/from-source
# install (`-e {repo}`) would force a local compile. PyPI instead publishes a stable-ABI wheel,
# `psutil-7.2.2-cp37-abi3-win_amd64.whl`, which covers every CPython from 3.7 through current
# (3.13/3.14 included) on win_amd64 -- so this draft installs psutil NON-EDITABLE, by version
# pin from PyPI (`uv pip install psutil==7.2.2`, which resolves the abi3 wheel automatically),
# and uses `{repo}` only as the source of the `tests/` tree. No local compilation needed.
#
# setup.py's TEST_DEPS = ["psleak", "pytest", "pytest-instafail", "pytest-xdist",
# "setuptools", plus pywin32/wheel/wmi guarded by `os_name == "nt" and implementation_name !=
# "pypy"` (true here)]. Installed below: `psleak` (giampaolo's own leak-assertion lib, used by
# test_memleaks.py) and `pywin32`/`wmi` -- these two are NOT optional on Windows: test_windows.py
# imports `win32api`/`win32con`/`win32process`/`wmi` at MODULE SCOPE guarded only by `if
# WINDOWS and not PYPY:`, so without them that whole file fails to import/collect rather than
# skipping cleanly. Left out: pytest-instafail/pytest-xdist (output-formatting/parallelism
# plugins, only activated via `-p instafail`/`-p xdist` in [tool.pytest] addopts, which is
# inert under this corpus's pytest pin -- see [addopts] below, so there's nothing for them to
# hook into), setuptools/wheel (build tooling, not test-runtime imports).
setup = [
  ["uv", "venv", "--python", "3.14", "{venv}"],
  # Pinned to the SAME pytest the corpus gates use as their oracle (8.4.2).
  ["uv", "pip", "install", "--python", "{py}", "pytest==8.4.2", "psleak", "pywin32", "wmi"],
  # EDITABLE, which reverses the draft's "non-editable from PyPI" plan, and the reason is
  # specific to psutil's layout. Both runners are invoked with cwd = the clone root, and the
  # clone contains a `psutil/` PACKAGE DIRECTORY. That directory shadows whatever is installed
  # in site-packages, and in a fresh checkout it has no compiled extension -- so the PyPI
  # wheel, although present and correct, is never the one imported and all 19 test modules die
  # with `ModuleNotFoundError: No module named 'psutil._psutil_windows'` (measured: pytest
  # exit 2 / 19 collection errors, rustest exit 2 / 19 -- identical on both sides, and
  # correctly reported as EE rather than a vacuous match).
  #
  # An editable install builds the C extension IN PLACE (`psutil/_psutil_windows.pyd` appears
  # in the clone), so the shadowing directory becomes the real, working package. This machine
  # has MSVC, so the build succeeds in ~21s; the draft's wheel-only plan was written to avoid
  # needing a compiler, but on this layout there is no way to avoid it.
  ["uv", "pip", "install", "--python", "{py}", "-e", "{repo}"],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-0.16.2-cp314-cp314-win_amd64.whl",
  ],
]
pythonpath = []

[addopts]
# pyproject.toml declares `[tool.pytest]` (NOT `[tool.pytest.ini_options]`) with a large
# addopts list: "--capture=no", "--instafail", "--no-header", "--strict-config",
# "--strict-markers", "--tb=short", "--verbose", "-p instafail", "-p no:doctest", "-p
# no:junitxml", "-p no:nose", "-p no:pastebin", "-p xdist"; plus verbosity_subtests = "0",
# testpaths = ["tests/"], python_files = ["test_*.py"]. `[tool.pytest]` is pytest 9's native
# TOML config table (added in pytest 9.0) -- this corpus's oracle pin, pytest==8.4.2, predates
# that and does not read it at all, so this entire block (including the plugin-enabling `-p`
# flags) is silently inert to the pytest leg, which is actually the SIMPLER outcome: no need
# to install/wire pytest-instafail or pytest-xdist to match it. `testpaths`/`python_files` are
# separately covered by `[repo].test_paths` and pytest's own `test_*.py` default respectively.
# OPEN ITEM for the implementer, same as Pillow's: confirm whether rustest's own
# pyproject-config reader also ignores bare `[tool.pytest]` (matching pytest 8.4.2) or already
# supports it like pytest 9 -- if rustest reads it and pytest 8.4.2 doesn't, `--strict-markers`
# / `--capture=no` / the `-p no:*` disables applying on one side only is itself a divergence
# source, not just a dropped no-op.
configured = [
  "--capture=no", "--instafail", "--no-header", "--strict-config", "--strict-markers",
  "--tb=short", "--verbose", "-p instafail", "-p no:doctest", "-p no:junitxml",
  "-p no:nose", "-p no:pastebin", "-p xdist",
]
replay = []
dropped = [
  "--capture=no", "--instafail", "--no-header", "--strict-config", "--strict-markers",
  "--tb=short", "--verbose", "-p instafail", "-p no:doctest", "-p no:junitxml",
  "-p no:nose", "-p no:pastebin", "-p xdist",
]

[run]
pytest_args = []
rustest_args = []
# RAISED from 1800 at Phase 4 Task 1c, and the reason is measured rather than defensive.
# 1800s was already only a 20% margin on Task 1b's pytest half (1 488s -- psutil's suite is
# dominated by `time.sleep` and process spawning, not by CPU), and that measurement was taken
# while rustest's half cost 8.5s because the suite did not collect at all. With MECHANISM M6
# fixed, rustest actually runs all 713 tests, most of which sleep for the same reasons pytest's
# do -- so the target's total roughly doubles. The first Task 1c attempt exceeded 1800s on the
# pytest half alone and had to be abandoned mid-run. Nothing about the suite changed; what
# changed is that there is now a second real run in the same budget.
timeout_s = 5400
# unittest.TestCase methods, zero parametrize usage confirmed directly in the three largest
# sampled files -- stable string ids, no value-derived parametrize id machinery in play.
# Same reasoning as cachetools'/jsonschema's drafts.
id_policy = "exact"

[divergence.ids]
# ONE ENTRY, ONE ID. This section used to hold a single blanket key, `*psutil/tests/*`,
# because at Task 1c the whole suite was blocked and every id was a consequence. That key is
# a pre-waiver over all 713 ids and would hide any real per-id divergence that appeared
# later, so it is replaced here by the one id that actually differs.
#
# MEASURED at the Phase 4 final polish wave, at the DEFAULT worker pool:
#   pytest : exit 1, 1948.05s, 327 passed / 11 failed / 375 skipped
#   rustest: exit 1, 1663.86s, 328 passed / 10 failed / 375 skipped
#   713 ids on both sides; 712 statuses identical, INCLUDING all 375 skips and 10 of the 11
#   failures (`test_all`, `test_invocation`, `test_it`, `test_name`, `test_open_files`,
#   `test_pids`, `test_procsmem`, `test_ps`, `test_pstree`, `test_username` -- psutil's own
#   environment-conditioned failures, this being a developer laptop and not psutil's CI).
#
# The 375 skips are the reason this target was picked (`@pytest.mark.skipif(not WINDOWS, ...)`
# on the per-platform base classes covering test_bsd/test_linux/test_osx/test_aix/test_sunos)
# and Task 1c had to record them as "STILL UNMEASURED". They are now measured, and they are
# exact.
"conformance/real/_work/psutil/tests/test_windows.py::TestCpuAPIs::test_cpu_freq" = """THE TARGET'S OWN FLAKE, and note the DIRECTION: pytest **failed** this and rustest **passed** it. Whatever it is, it is not rustest failing something pytest passes.

`TestCpuAPIs::test_cpu_freq` compares `psutil.cpu_freq()` against the frequency Windows reports through WMI/the registry. That is a live hardware reading on a laptop whose clock moves with turbo, thermal state and idle -- the two runners sampled it ~30 minutes apart in the same sweep and got different answers. It is a timing-dependent measurement of the machine, not a property of either runner, and it belongs in the same class as marshmallow's wall-clock-in-a-nodeid and jsonschema's import-order dependency: a target property the gate reports rather than hides.

NOT pre-waived any wider than this one id, deliberately. If this test starts flipping the other way, or if a second id joins it, the gate must say so."""

[divergence.global]
# The tally DOES still differ, by exactly one test moving between two buckets, and that is the
# `test_cpu_freq` flake ledgered above showing up in the totals. Everything else is identical.
tally = """pytest 327 passed / 11 failed / 375 skipped; rustest 328 passed / 10 failed / 375 skipped, over the same 713 ids, exit 1 on both. The whole of the difference is one test crossing from `failed` to `passed`: `test_windows.py::TestCpuAPIs::test_cpu_freq`, a live CPU-frequency reading, which the ids ledger above records as the target's own flake -- and which failed on PYTEST's side, not rustest's.

THE 375 SKIPS ARE NOW MEASURED AND EXACT, which is what this target was picked for. They are the platform gating (`@pytest.mark.skipif(not WINDOWS, ...)` on the per-platform base classes covering test_bsd/test_linux/test_osx/test_aix/test_sunos); Task 1c had to record them as STILL UNMEASURED because the suite did not collect. rustest reproduces all 375.

The 10 shared failures are psutil's own, in an unelevated developer environment that is not psutil's CI: test_all, test_invocation, test_it, test_name, test_open_files, test_pids, test_procsmem, test_ps, test_pstree, test_username. Both runners fail the same ten."""

# HISTORY, kept because two of this corpus's most expensive findings were recorded here and
# both are now closed by measurement rather than by assertion.
#
# MECHANISM M6 -- FIXED and pinned. `pytest.fail.Exception` / `skip.Exception` /
# `xfail.Exception` did not exist on the compat shim. pytest builds them in
# `_pytest/outcomes.py` via `@_with_exception(Failed)`, which hangs the exception class off the
# function object; psutil's `tests/__init__.py` l. 760 reads `exception=(AssertionError,
# pytest.fail.Exception)` at MODULE level, so the attribute is reached at IMPORT time and never
# has to be raised. Without it all 19 of psutil's test modules failed to import and rustest
# reported ZERO tests against pytest's 713 -- the highest-leverage single finding of the Task 1b
# sweep, and three attribute assignments to fix. Closed in Task 1c and pinned by the corpus case
# `marks/outcome-exception-attrs`.
#
# MECHANISM M11 (the stall) -- **NOT REPRODUCED.** Task 1c measured rustest running this suite
# for 95 minutes without finishing, and its evidence was not "slow" but "idle": four worker
# processes whose UserModeTime AND KernelModeTime were byte-identical across samples ~50s apart,
# one of them with zero CPU since start. That signature is absent now. Measured at the DEFAULT
# pool (4 workers) during the final polish wave: the suite completed in 1 663.86s, and worker
# CPU was sampled repeatedly throughout and rose monotonically at ~0.9 cores per live worker
# (e.g. two workers 96s apart: 45.1 -> 132.7 and 31.7 -> 116.8 CPU-seconds), with workers
# exiting as they finished their files. The suite is not pinned to `-n 1` and does not need to
# be.
#
# What plausibly fixed it, in order of likelihood and NOT separable by this evidence: the
# Windows job object (#140, `e0b9fe8`), which makes every grandchild psutil spawns die with its
# worker; the default pool dropping from `cpu_count` to 4 on a suite whose tests manipulate
# process-global state; and two-phase spawn changing the timing of everything after it. The
# grandchild-inherits-the-protocol-pipe hypothesis is half wrong on its own terms --
# `_worker._detach_protocol_stream` already dups the protocol channel onto a private,
# non-inheritable descriptor -- though the failure CLASS is real and is now reproduced and
# contained in a unit test.
#
# The harness defect that compounded it (a fired `timeout_s` that could not reap orphaned
# workers, so no verdict was ever written) is closed by the same job object.
# Two pre-flight flags from the audit, both still UNTESTED for the same reason -- rustest never
# collected, so neither question has been answered yet:
# - tests/test_sudo.py needs elevated privileges and is run OUTSIDE pytest entirely in
#   upstream CI (`python -m unittest tests.test_sudo`, not part of `make test`'s pytest
#   invocation). It's still inside `test_paths = ["tests"]` here and will get collected by
#   both engines; if neither runner is elevated, both should hit the same failures/errors
#   identically (a MATCH per the pynite.toml precedent), but confirm at gate time rather than
#   assume -- consider excluding it explicitly if it proves noisy.
# - tests/test_memleaks.py is run with PYTHONMALLOC=malloc in upstream CI (a separate
#   invocation); not set here. May behave differently without it -- flag if leak-detection
#   tests are flaky.
