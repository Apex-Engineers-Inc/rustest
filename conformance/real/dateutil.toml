# python-dateutil -- KEPT over the pre-clone audit's mechanical SWAP flag, per the Task 1b
# adjudication recorded in the plan ("single shallow modifyitems = the user's 'limited ways'
# case; delta ledgered; hypothesis in its own venv").
#
# The auditor flagged it HEAVY on the letter of Batch 1's rule ("LIMITED = fixtures +
# pytest_collection_modifyitems-FREE helpers"). The hook in question, the whole of it, is:
#
#     def pytest_collection_modifyitems(items):
#         for item in items:
#             marker_getter = getattr(item, 'get_closest_marker', None)
#             if marker_getter is None:
#                 marker_getter = item.get_marker
#             marker = marker_getter('xfail')
#             if marker and (not marker.args or marker.args[0]):
#                 item.add_marker(pytest.mark.no_cover)
#
# It adds a `no_cover` marker to already-xfailed items, for the benefit of a coverage plugin
# this corpus does not install. It changes no selection, generates no items, and reorders
# nothing -- so under this gate it is inert by construction, and that is precisely the
# ledgerable claim being tested here (see [divergence.global] modifyitems note below).
#
# Why this target earns its slot regardless of the hook: it is the only suite in the
# seventeen that (a) mixes `unittest.TestCase` classes with native pytest functions in one
# tree, (b) declares `xfail_strict = true` GLOBALLY in ini rather than per-mark, (c) turns
# DeprecationWarning and PendingDeprecationWarning into errors on top of a bare `error`, (d)
# overrides `python_files` with a three-pattern list including the unusual `*_solution.py`,
# (e) registers twelve bare markers, and (f) is driven in part by Hypothesis. Six ini and
# authoring axes the rest of the corpus does not reach.
#
# Repo also moved to src-layout at this tag (`src/dateutil/`, tests at top-level `tests/`),
# confirmed on the clone -- not the `dateutil/test/` package-internal layout the original
# task brief anticipated.

[repo]
kind = "oss"
url = "https://github.com/dateutil/dateutil.git"
tag = "2.9.0.post0"
# Lightweight tag; commit SHA directly. Re-verified at clone time with
# `git ls-remote https://github.com/dateutil/dateutil.git refs/tags/2.9.0.post0` -- the audit
# could only web-corroborate it (api.github.com 403'd for that whole session).
rev = "1ae807774053c071acc9e7d3d27778fba0a7773e"
test_paths = ["tests"]

[env]
setup = [
  ["uv", "venv", "--python", "3.14", "{venv}"],
  # `hypothesis` IS installed here, deliberately and per the task instruction ("hypothesis
  # installs in ITS venv"): `tests/property/{test_isoparse_prop,test_parser_prop,
  # test_tz_prop}.py` use `@given(...)` at module scope, so without it those three files fail
  # to import and the suite silently shrinks. It is scoped to THIS venv only -- no other
  # target in the corpus gets it, and the rustest development environment never sees it.
  #
  # `six` and `freezegun` are hard test imports. `tzdata` covers Windows shipping no IANA
  # database (same finding as marshmallow).
  #
  # `pytest-cov` IS installed here, breaking this corpus's usual "drop the coverage plugins"
  # convention, and the reason is load-bearing rather than cosmetic. The conftest hook adds
  # `pytest.mark.no_cover` to xfailed items; `no_cover` is a marker **pytest-cov registers**.
  # Without pytest-cov the mark is unknown, and setup.cfg's `filterwarnings = error` promotes
  # the resulting `PytestUnknownMarkWarning` to an exception -- raised INSIDE
  # `pytest_collection_modifyitems`, which pytest reports as a full INTERNALERROR. Measured
  # without it: pytest INTERNALERROR + exit 3, rustest exit 2, gate EE. Upstream's
  # requirements-dev.txt installs pytest-cov, so this restores the environment the suite is
  # actually written against. No `--cov` flag is passed to either runner, so the plugin
  # registers its markers and does nothing else.
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "pytest==8.4.2",
    "pytest-cov",
    "six",
    "hypothesis",
    "freezegun",
    "tzdata",
  ],
  # NON-EDITABLE, from PyPI, at the same version as the pinned tag -- the Pillow/psutil
  # pattern rather than Batch 1's `-e {repo}`, for a reason specific to this project. dateutil
  # does not commit its vendored IANA database: `src/dateutil/zoneinfo/dateutil-zoneinfo.tar.gz`
  # is GENERATED by `updatezinfo.py`, which shells out to the IANA `zic` compiler. `zic` does
  # not exist on Windows -- measured, `updatezinfo.py` dies with `FileNotFoundError: [WinError
  # 2]` -- so an editable install of the git tree has no zoneinfo at all and
  # `tests/test_tz.py` cannot be collected by EITHER runner. The published wheel bundles the
  # tarball. `{repo}` is still checked out and still supplies `test_paths`.
  #
  # Worth recording, because it is the one place in this sweep where the two runners failed
  # the SAME broken environment differently: with no zoneinfo, pytest raised at
  # `tests/test_tz.py` import (setup.cfg's `filterwarnings = error` promoting dateutil's own
  # `UserWarning: I/O error(2)`), while rustest sailed past the warning and died further down
  # the same module on the consequence (`ValueError: Datetime is naive and no time zone
  # provided`). Both refused the file; only pytest refused it at the warning. Provisioning the
  # database removes the condition entirely -- both runners now collect 2095 -- so there is no
  # graded divergence left to ledger, but the observation belongs on the record.
  ["uv", "pip", "install", "--python", "{py}", "python-dateutil==2.9.0.post0"],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-0.16.2-cp314-cp314-win_amd64.whl",
  ],
]
pythonpath = []

[addopts]
# setup.cfg `[tool:pytest]` declares NO addopts key at all. What it does declare -- and what
# makes this target interesting -- is `python_files = test_*.py, *_test.py, *_solution.py`,
# `xfail_strict = true`, `filterwarnings = error, error::DeprecationWarning,
# error::PendingDeprecationWarning`, and twelve bare markers. Each runner reads all of that
# from setup.cfg for itself; nothing is replayed and nothing is dropped.
configured = []
replay = []
dropped = []

[run]
pytest_args = []
rustest_args = []
timeout_s = 1800
id_policy = "exact"

[divergence.ids]
"tests/test_parser.py::ParserTest::*" = """\
NEW MECHANISM (first sighting in this sweep), 8 tests: **pytest's xunit `setup_class` and \
`setup_method` hooks are honoured on `unittest.TestCase` subclasses; rustest's are not.** \
`class ParserTest(unittest.TestCase)` (tests/test_parser.py:408) defines its shared state in \
`@classmethod def setup_class(cls)` -- the PYTEST xunit spelling -- not unittest's own \
`setUpClass`. pytest's `_pytest/unittest.py::UnitTestCase.collect()` calls \
`_inject_setup_class_fixture()` and `_inject_setup_method_fixture()`, so a TestCase subclass \
gets BOTH unittest's native hooks and pytest's xunit ones. rustest honours only the native \
`setUpClass`/`setUp` on such a class, so `cls.tzinfos`/`cls.brsttz`/`cls.default`/ \
`cls.uni_str`/`cls.str_str` are never assigned and every test that reads one dies with \
`AttributeError: 'ParserTest' object has no attribute 'brsttz'` (or `'default'`, or \
`'str_str'`).

The failure set is self-confirming: exactly the 8 tests of ~240 in this class that touch one \
of those five attributes fail (testDateCommandFormat, testDateCommandFormatReversed, \
testFuzzy, testFuzzyWithTokens, testParserParseStr, testPertain, testRandomFormat24, \
test_hmBY); the rest of the class passes, because it never reads class state.

Minimal repro, and it shows the gap is WIDER than this suite reveals -- both spellings are \
affected, not just the class one:

    class TCWithSetupClass(unittest.TestCase):
        @classmethod
        def setup_class(cls): cls.value = "x"
        def test_sees_it(self): assert getattr(self, "value", None) == "x"

    class TCWithSetupMethod(unittest.TestCase):
        def setup_method(self, method): self.mval = "y"
        def test_sees_it(self): assert getattr(self, "mval", None) == "y"

pytest: 2 passed. rustest: 2 failed. Note the adjacent case already works -- xunit hooks on a \
PLAIN (non-TestCase) class are honoured, which is what HEAD's `fix(compat): ... xunit ...` \
commit addressed; the uncovered case is specifically their injection onto TestCase \
subclasses. Not order-dependent (reproduces on the one file, and on the 4-line repro). \
rustest DEFECT. PHASE-4-FOLLOWUP."""

[divergence.global]
exit_code = """\
rustest exits 1 where pytest exits 0, entirely as a consequence of the 8 failures ledgered \
above."""
tally = """\
pytest 2001 passed / 74 skipped / 20 xfailed / 0 failed; rustest 1993 passed / 74 skipped / \
20 xfailed / 8 failed. 2095 ids on both sides, identical spelling, identical skip and xfail \
sets -- which is the notable part beyond the failures: `xfail_strict = true` in ini, the \
three-pattern `python_files` override (including `*_solution.py`), the twelve bare markers, \
`filterwarnings = error, error::DeprecationWarning, error::PendingDeprecationWarning`, the \
unittest/native-pytest mix, and all three Hypothesis `@given` property modules \
(tests/property/) all agree exactly. NOTHING was deselected: the task allowed deselecting \
hypothesis-driven tests if they diverged for hypothesis-internal reasons, and they did not \
diverge, so the full suite runs.

The conftest's `pytest_collection_modifyitems` -- the hook the pre-clone audit flagged -- is \
confirmed INERT under this gate exactly as the adjudication predicted: it only adds \
`pytest.mark.no_cover` to already-xfailed items, no coverage run consumes it, selection and \
ordering are untouched, and the 2095 ids match. The one thing it does require is that the \
marker be REGISTERED (see [env]): without pytest-cov installed, `filterwarnings = error` \
turns the resulting PytestUnknownMarkWarning into an exception inside the hook and pytest \
INTERNALERRORs."""
