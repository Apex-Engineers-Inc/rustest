# tabulate -- SWAP-IN for python-dateutil (Phase 4 Task 1b audit). dateutil's tests/conftest.py
# at 2.9.0.post0 defines a real pytest_collection_modifyitems (walks items, adds
# mark.no_cover to non-strict-xfail-marked tests) -- a shallow, mechanical hook, but the
# task's own classification rule draws LIMITED as "pytest_collection_modifyitems-FREE
# helpers", so by the letter of that rule this is HEAVY, not LIMITED. dateutil's suite also
# hard-requires hypothesis>=3.30 (three property-test files under tests/property/) and mixes
# unittest.TestCase with native pytest functions -- collectively enough non-trivial surface
# that it's swapped out rather than argued around.
#
# tabulate has NO conftest.py anywhere and NO pytest_* hooks anywhere in the repo. Its ~284+
# tests in test/ (note: singular "test/", not "tests/") are plain pytest-style functions, not
# nose-style generators and not unittest.TestCase. New domain: tabular text formatting.

[repo]
kind = "oss"
url = "https://github.com/astanin/python-tabulate.git"
tag = "v0.10.0"
# Lightweight tag; commit SHA directly.
rev = "3b4cd509820e4c45cd2aaba833aa585ea6308b94"
test_paths = ["test"]

[env]
# No [tool.pytest.ini_options]/pytest.ini/setup.cfg/tox.ini [pytest] section exists at all.
# tox.ini's own invocation adds "-v --doctest-modules --ignore benchmark" and, in its "-extra"
# envs only, numpy/pandas/wcwidth (to avoid skipping the optional-format tests) -- none of
# that is ini-declared, so [addopts] below is empty per this corpus's existing convention
# (more-itertools' own tox invocation is likewise not replayed). This first-pass draft installs
# only pytest + an editable tabulate, accepting that the numpy/pandas/wcwidth-gated tests will
# skip identically on both runners; add the widechars extra ("wcwidth") plus numpy/pandas back
# in if fuller coverage is wanted.
setup = [
  ["uv", "venv", "--python", "3.14", "{venv}"],
  # Pinned to the SAME pytest the corpus gates use as their oracle (8.4.2).
  ["uv", "pip", "install", "--python", "{py}", "pytest==8.4.2"],
  ["uv", "pip", "install", "--python", "{py}", "-e", "{repo}"],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-0.16.2-cp314-cp314-win_amd64.whl",
  ],
]
pythonpath = []

[addopts]
# The repo declares no pytest config at all. tox.ini's own CLI-level "-v --doctest-modules
# --ignore benchmark" is a tox invocation detail, not ini config -- not replayed, same
# treatment more-itertools' tox invocation gets.
configured = []
replay = []
dropped = []

[run]
pytest_args = []
rustest_args = []
timeout_s = 1800
# Draft default. test_output.py/test_regression.py parametrize over row/column data
# (tuples/lists of mixed types) -- the same value-kinds click/jinja2 already ledgered as
# spelling-only id divergences under rustest's parametrize-id generation. Expect the same
# mechanism here; verify at gate time and relax from "exact" if so.
id_policy = "strip_params"

[divergence.ids]

[divergence.global]
