# Apex Member Designer's `server/` suite -- the user-designated acceptance target, and the
# reason Phase 3 ported pytest-asyncio's loop-scope model at all: it runs
# `asyncio_mode = "auto"` with BOTH loop-scope defaults set to `session`, on a
# free-threaded CPython 3.14t interpreter, over ~6k tests that talk to a real MongoDB.
#
# READ-ONLY, AND MEANT LITERALLY. Nothing is installed into the repo's own `.venv`,
# nothing is written into its tree, and its `uv.lock` is never updated:
#
#   * the environment is built OUTSIDE the tree from `uv export --frozen`, so the lock is
#     read and never rewritten;
#   * pytest runs with `-p no:cacheprovider`, so no `.pytest_cache` appears;
#   * the reporting plugin is copied into the harness's temp directory and reached via
#     PYTHONPATH, never dropped into the repo;
#   * `.rustest_cache` is removed after the run unless the repo already had one.

[repo]
kind = "local"
path = "C:/Users/JeffreyMBloss/local-repos/Apex-Member-Designer/main/server"
test_paths = ["tests"]

[env]
# 3.14t, not 3.14: the repo pins `3.14+freethreaded` in `.python-version`, its lock is
# resolved for that ABI, and its own `.venv` is a cp314t build. rustest is installed from
# the cp314t wheel built for this sweep (`maturin build --release -i python3.14t`).
#
# `--no-emit-package rustest` keeps the lock's own rustest (a git dependency on this
# project's `main`) out of the environment: the point of the run is THIS working tree's
# engine, and letting the lock install a different rustest over it would validate the
# wrong binary. `--no-default-groups --group dev` takes the test dependencies
# (pytest, pytest-asyncio, ...) without the `build` group's PyInstaller.
setup = [
  ["uv", "venv", "--python", "3.14t", "{venv}"],
  [
    "uv",
    "export",
    "--frozen",
    "--project",
    "{repo}",
    "--no-default-groups",
    "--group",
    "dev",
    "--no-emit-project",
    "--no-emit-package",
    "rustest",
    "--no-hashes",
    "--format",
    "requirements-txt",
    "-o",
    "{work}/_member-designer-requirements.txt",
  ],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "-r",
    "{work}/_member-designer-requirements.txt",
  ],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-0.16.2-cp314-cp314t-win_amd64.whl",
  ],
]

# NO COMPENSATION, as of Phase 4 Task 1. Through Phase 3 the harness exported the repo's
# `pythonpath = ["src"]` on PYTHONPATH for both runners, because pytest honoured the ini
# (`Config._configure_python_path`) and rustest's v2 engine did not implement it -- without
# the scaffolding every one of the ~285 test files failed to import and the comparison
# measured one missing ini option instead of a suite. v2 reads and applies the ini itself
# now (`_v2_worker::_apply_pythonpath`, protocol v6), so the scaffolding is gone and rustest
# resolves `src/` from the repo's own pyproject.toml exactly as pytest does.
pythonpath = []

[addopts]
# pyproject.toml: addopts = ["-vv", "-s"]. Recorded, not replayed: since Phase 4 Task 1
# each runner applies the target's own `addopts` for itself, so nothing is put on either
# command line. Both are core pytest flags rustest also accepts, so nothing is dropped.
# (The repo's commented-out `--cov --cov-report=xml:cov.xml` line is not active.)
configured = ["-vv", "-s"]
replay = []
dropped = []

[run]
pytest_args = []
# `-n 1`, and it is the one runner flag this target carries. NOT a compensation for a
# compat defect: it is the only way to ask the two runners the same question about a suite
# whose fixtures **drop and recreate a single shared MongoDB database**. rustest's default
# worker pool gives each worker its own session-scoped fixtures, so worker B's `testDB`
# teardown lands while worker A is mid-insert and pymongo answers
# `OperationFailure: The database is currently being dropped`. Measured on this tree:
# default pool -> 262 errors + 94 failures; `-n 1` -> 0 errors, 25 failures, 6082 passed.
# The parallel result is ledgered under [divergence.global] rather than hidden, because it
# is a real and reportable property of running this suite under rustest.
rustest_args = ["-n", "1"]
# ~6k tests against a real MongoDB, twice.
timeout_s = 7200
# `strip_params`, for the reason click and jinja2 declare it: this suite parametrizes over
# dataclass scenarios, enums and numpy arrays, and rustest's parametrize ids do not
# reproduce pytest's `IdMaker` for any non-scalar. Under `exact` those 473 spelling
# differences arrive as 946 separate per-id problems and drown every real one. Under
# `strip_params` the raw id difference is raised as its own graded `ids` problem -- it still
# needs a mechanism, and it still goes stale the moment `IdMaker` is ported -- and outcomes
# are compared per `file::function` as a status multiset. The cost is that it cannot say
# WHICH parameter case moved, and it is blind to two cases of one function trading statuses.
id_policy = "strip_params"


[divergence.ids]
# Everything this section used to hold is fixed. The four collection errors that stopped the
# whole suite (`pytestmark = pytest.mark.asyncio`), the 120 `TestAPIEndpoints` failures
# (`indirect=`), the 9 xfails that never applied (`pytest.param(marks=...)`, on a *fixture's*
# params), the 8 `setup_method` failures (xunit hooks), the 13 markdown ids (no `.md` on a
# directory walk) and the 946 spelling differences (`IdMaker`) are all gone.
#
# What is left is **four tests**, and as of Phase 4 Task 1b all four are ADJUDICATED to
# exactly two mechanisms, both reproduced in isolation (single-file/single-class runs, so
# neither is order-dependent, neither is environmental, and both are rustest defects).

"tests/test_lib/test_designs/test_steel/test_flange_bracing.py::*" = """\
ADJUDICATED (Phase 4 Task 1b), 2 tests. MECHANISM: `rustest.approx` is a simplified \
reimplementation, not a port of `_pytest.python_api.approx`, and it omits pytest's \
`ApproxBase.__array_ufunc__ = None` / `__array_priority__ = 100`. Those two attributes are \
the entire reason `ndarray == approx(scalar)` works under pytest: they make numpy's \
`ndarray.__eq__` return NotImplemented so Python falls back to approx's own `__eq__`, which \
returns a plain bool. Without them numpy wins the dispatch and yields an elementwise bool \
ARRAY, so the enclosing `assert` raises `ValueError: The truth value of an array with more \
than one element is ambiguous`. Both tests assert `<ndarray> == approx(<float>)` \
(`res.primary.available[sagging]`, `res.primary.cb`). Verified directly in this target's own \
venv: `np.array([5.,5.,5.]) == pytest.approx(5.0)` -> `True`, `... == rustest.approx(5.0)` -> \
`array([True, True, True])`. Reproduces running the one file alone. rustest DEFECT, \
fix = port approx. PHASE-4-FOLLOWUP."""

"tests/test_lib/test_helpers/test_link_helpers.py::TestAnalyticFootprintHelpers::*" = """\
ADJUDICATED (Phase 4 Task 1b), 1 test. SAME MECHANISM as the flange_bracing entry above -- \
`rustest.approx` vs `_pytest.python_api.approx` -- a different facet of it. pytest's \
signature is `approx(expected, rel=None, abs=None, nan_ok=False)`, where None means \
"unspecified"; rustest's is `approx(expected, rel=1e-6, abs=1e-12)` and takes whatever it is \
handed literally. This suite's own helper is `def approx(expected, abs_tol=None): return \
pytest.approx(expected, abs=abs_tol)`, so it passes `abs=None` explicitly on every call. \
rustest then evaluates `max(self.rel * max(|actual|,|expected|), self.abs)` with `self.abs is \
None` -> `TypeError: '>' not supported between instances of 'NoneType' and 'float'`. It only \
surfaces when the two floats are NOT bit-identical, because `_is_close` short-circuits on \
exact equality first -- which is why one test in this suite trips it and hundreds of other \
bare-approx assertions do not. Probed facets of the same gap: `rel=None` -> `TypeError: \
unsupported operand type(s) for *`, `nan_ok=True` -> `TypeError: unexpected keyword \
argument`. Reproduces running the one class alone. rustest DEFECT, same fix. \
PHASE-4-FOLLOWUP."""

"tests/test_lib/test_models/test_analysis/test_framing_2d_member.py::TestJackStudReleases::*" = """\
ADJUDICATED (Phase 4 Task 1b), 1 test (the `[header_lines1]` case; `[header_lines0]` passes). \
MECHANISM, and it is a DIFFERENT and more serious one than the approx entries: **rustest \
unpacks a length-1 sequence argvalue under a SINGLE argname.** The declaration is \
`@pytest.mark.parametrize("header_lines", [None, [LineString(...)]])`; pytest binds \
`header_lines = [LineString(...)]` (a list), rustest binds `header_lines = LineString(...)` \
(the bare element), and the suite's `for line in lines` then raises `TypeError: 'LineString' \
object is not iterable`. pytest unpacks an argvalue into multiple parameters only when \
`len(argnames) > 1`; rustest evidently unpacks whenever `len(value) == len(argnames)`, and \
the two rules collide at exactly one argname + one element. Minimal repro, single argname \
`x`, values `[None, ["a"], ["a","b"], ("t",)]`: pytest binds `None / ['a'] / ['a','b'] / \
('t',)`, rustest binds `None / 'a' / ['a','b'] / 't'`. Note `["a","b"]` is unaffected (len 2 \
!= 1 argname), so this is specifically the length-1 case. The dangerous property is that it \
is usually SILENT -- a test receives the wrong value and still passes -- and it was only \
visible here because the wrong value happened to be un-iterable. Reproduces running the one \
class alone. rustest DEFECT, fix = gate unpacking on `len(argnames) > 1`. PHASE-4-FOLLOWUP."""
[divergence.global]
exit_code = """\
rustest exits 1 (tests failed) where pytest exits 0, which is the consequence of the 4 \
failing tests named in the per-id entries above and of nothing else."""
tally = """\
Under `-n 1` (what the gate runs): pytest 6084 passed / 37 skipped / 10 xfailed / 1 xpassed \
/ 0 failed / 0 error; rustest 6080 passed / 4 failed and every other bucket identical. 6132 \
ids on both sides -- the same set, the same spelling. The four failures are the four per-id \
entries above and nothing else.

UNDER THE DEFAULT WORKER POOL, and this is the reportable part: hundreds of errors, almost \
all `pymongo.errors.OperationFailure: The database is currently being dropped`. This \
suite's fixtures drop and recreate ONE shared MongoDB database, and rustest gives each \
worker its own session-scoped fixtures, so one worker's teardown lands inside another \
worker's transaction. It is not a compat defect -- rustest runs the tests the suite asked \
for -- but it is a real cost of running a shared-database suite under a parallel runner, \
and the fix available today is `-n 1`, which is what `[run] rustest_args` pins. \
KNOWN-LIMITATION."""
