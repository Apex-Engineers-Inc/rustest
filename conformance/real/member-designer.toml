# Apex Member Designer's `server/` suite -- the user-designated acceptance target, and the
# reason Phase 3 ported pytest-asyncio's loop-scope model at all: it runs
# `asyncio_mode = "auto"` with BOTH loop-scope defaults set to `session`, on a
# free-threaded CPython 3.14t interpreter, over ~6k tests that talk to a real MongoDB.
#
# READ-ONLY, AND MEANT LITERALLY. Nothing is installed into the repo's own `.venv`,
# nothing is written into its tree, and its `uv.lock` is never updated:
#
#   * the environment is built OUTSIDE the tree from `uv export --frozen`, so the lock is
#     read and never rewritten;
#   * pytest runs with `-p no:cacheprovider`, so no `.pytest_cache` appears;
#   * the reporting plugin is copied into the harness's temp directory and reached via
#     PYTHONPATH, never dropped into the repo;
#   * `.rustest_cache` is removed after the run unless the repo already had one.

[repo]
kind = "local"
path = "C:/Users/JeffreyMBloss/local-repos/Apex-Member-Designer/main/server"
test_paths = ["tests"]

[env]
# 3.14t, not 3.14: the repo pins `3.14+freethreaded` in `.python-version`, its lock is
# resolved for that ABI, and its own `.venv` is a cp314t build. rustest is installed from
# the cp314t wheel built for this sweep (`maturin build --release -i python3.14t`).
#
# `--no-emit-package rustest` keeps the lock's own rustest (a git dependency on this
# project's `main`) out of the environment: the point of the run is THIS working tree's
# engine, and letting the lock install a different rustest over it would validate the
# wrong binary. `--no-default-groups --group dev` takes the test dependencies
# (pytest, pytest-asyncio, ...) without the `build` group's PyInstaller.
setup = [
  ["uv", "venv", "--python", "3.14t", "{venv}"],
  [
    "uv",
    "export",
    "--frozen",
    "--project",
    "{repo}",
    "--no-default-groups",
    "--group",
    "dev",
    "--no-emit-project",
    "--no-emit-package",
    "rustest",
    "--no-hashes",
    "--format",
    "requirements-txt",
    "-o",
    "{work}/_member-designer-requirements.txt",
  ],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "-r",
    "{work}/_member-designer-requirements.txt",
  ],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-0.16.2-cp314-cp314t-win_amd64.whl",
  ],
]

# THE COMPENSATION, AND IT IS A DIVERGENCE, NOT A CONVENIENCE. The repo sets
# `pythonpath = ["src"]`, which pytest honours (`_pytest/python_path.py`) and rustest's v2
# engine does not implement at all -- v1 did, in `src/python_support.rs`
# ::read_pythonpath_from_pyproject. Without compensation every one of the ~285 test files
# fails to import and the comparison degenerates to "6132 passed vs 285 collection
# errors", which measures one missing ini option and nothing else about the suite. So the
# harness exports the same entry on PYTHONPATH for BOTH runners and the missing option is
# ledgered as its own divergence below, where it can be read.
pythonpath = ["src"]

[addopts]
# pyproject.toml: addopts = ["-vv", "-s"]. Both are core pytest flags rustest also
# accepts, so both are replayed to both runners and nothing is dropped. (The repo's
# commented-out `--cov --cov-report=xml:cov.xml` line is not active and is not replayed.)
configured = ["-vv", "-s"]
replay = ["-vv", "-s"]
dropped = []

[run]
pytest_args = []
rustest_args = []
# ~6k tests against a real MongoDB, twice.
timeout_s = 7200

[notes]
pythonpath_ini = """\
DIVERGENCE, COMPENSATED. rustest's v2 engine does not implement the `pythonpath` ini \
option; pytest does (`_pytest/python_path.py::pytest_load_initial_conftests`), and \
rustest's own v1 engine did (`src/python_support.rs::read_pythonpath_from_pyproject`), so \
this is a regression the rewrite has not yet closed. Probed directly: a two-file tree with \
`pythonpath = ["src"]` collects and passes under pytest and raises \
`ModuleNotFoundError: No module named 'mylib'` under rustest. The harness exports the same \
entry on PYTHONPATH for both runners so the remaining ~6k-test comparison is about test \
semantics rather than sys.path. PHASE-4 / KNOWN-LIMITATION."""

[divergence.ids]
# ONE defect, and it stops the entire suite. Four modules do
#
#     pytestmark = pytest.mark.asyncio
#
# at module level (`tests/test_lib/test_analysis/test_wall_fem/
# test_flush_bearing_ownership_regression.py:39` and `.../test_wall_column_ownership_
# regression.py`, `tests/test_lib/test_designs/test_wood/test_flush_header_golden_gate.py:43`,
# `tests/test_lib/test_links/test_corner_king_candidacy_regression.py`).
#
# `MarkGenerator.asyncio` is a plain METHOD on the class (python/rustest/decorators.py:709),
# not one of the `BareOrFactoryMark` instances `__init__` binds for skipif/xfail/usefixtures.
# As a decorator that is fine -- `@mark.asyncio` calls the method with `func`. As a *value* it
# is not: `pytest.mark.asyncio` evaluates to a bound method, and rustest's module-level
# pytestmark validation rejects it with
#   "malformed pytestmark entry on '<module>': <bound method MarkGenerator.asyncio ...>
#    is not a mark".
# The class's own docstring already names this failure mode for the other three marks --
# "a method cannot tell a decoration from a factory call and silently ate the test function
# when used bare (defects #136 and #137)" -- and `asyncio` is the one that kept its method
# form, so it carries the same defect into the `pytestmark` position.
#
# Four collection errors mean NOTHING RUNS: pytest's `pytest_runtestloop` raises `Interrupted`
# before the first item and `src/v2/execute.rs::stage` encodes the identical rule, so rustest
# exits 2 with an empty test list. Every one of pytest's 6132 ids is therefore "missing from
# rustest" for this single reason, which is what the `*` glob says. §5 of the task report
# records a supplementary run over `tests/test_startup` -- a subtree with none of the four
# files in it -- showing what the suite actually does once collection succeeds.
# PHASE-4 / KNOWN-LIMITATION (the fix is one line: bind `asyncio` as a `BareOrFactoryMark`).
"*" = "collection interrupted: `pytestmark = pytest.mark.asyncio` is a bound method, not a mark, in 4 modules; 4 collection errors => nothing runs. See the note above. PHASE-4"

[divergence.global]
exit_code = """\
CONSEQUENCE of the pytestmark entry: rustest exits 2 (collection error) where pytest exits \
0. It is pytest's own exit code for the same situation, applied to a situation pytest does \
not have."""
tally = """\
CONSEQUENCE of the same entry: pytest 6084 passed / 37 skipped / 10 xfailed / 1 xpassed / 0 \
errors, rustest 0 of everything with 4 collection errors."""
