# jinja2 -- a suite with heavy fixture use, parametrized fixtures whose params are
# *functions* (`params=[_asyncio_run, trio.run]`), async tests driven without
# pytest-asyncio, and `filterwarnings = ["error"]`.

[repo]
kind = "oss"
url = "https://github.com/pallets/jinja.git"
tag = "3.1.6"
# Annotated tag; this is the commit it points at.
rev = "15206881c006c79667fe5154fe80c01c65410679"
test_paths = ["tests"]

[env]
# `requirements/tests.in` is exactly `pytest` and `trio`; MarkupSafe comes in with the
# editable install of the project itself.
setup = [
  # 3.13, not the 3.14 the other two OSS targets use, and the reason is this machine, not
  # jinja2: the uv-managed `cpython-3.14.2-windows-x86_64-none` install here is missing
  # `libcrypto-3-x64.dll`, so `import ssl` raises
  # `ImportError: DLL load failed while importing _ssl`. jinja2's `tests/test_async.py` and
  # `tests/test_async_filters.py` import `trio`, which imports `ssl`, so BOTH runners fail
  # to collect them -- an environment fault that agrees with itself. (It is caught as a
  # vacuous run by `grade_real` now, but the fix is a working interpreter.) click and
  # more-itertools never import ssl, which is why only this target trips over it.
  ["uv", "venv", "--python", "3.13", "{venv}"],
  # Pinned to the SAME pytest the corpus gates use as their oracle (this repo's dev
  # dependency, 8.4.2). Unpinned, uv installs the newest release and the comparison starts
  # measuring pytest-version skew instead of rustest: on pytest 9.1.1 click 8.4.2's
  # `tests/test_basic.py` raises `PytestRemovedIn10Warning: Passing a non-Collection
  # iterable to parametrize is deprecated`, which the repo's `filterwarnings = ["error"]`
  # turns into a collection error, so pytest exits 2 having run nothing at all.
  ["uv", "pip", "install", "--python", "{py}", "pytest==8.4.2", "trio"],
  ["uv", "pip", "install", "--python", "{py}", "-e", "{repo}"],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-0.16.2-cp313-cp313-win_amd64.whl",
  ],
]
pythonpath = []

[addopts]
# jinja2 declares no addopts.
configured = []
replay = []
dropped = []

[run]
pytest_args = []
rustest_args = []
timeout_s = 1800
# jinja2 parametrizes over *functions* (`params=[_asyncio_run, trio.run]`, and bare lambdas
# for the sync/async variants), which is one of the value kinds rustest names differently
# from pytest -- 95 of 909 ids differ by spelling alone. Same treatment as click: the id
# divergence becomes its own graded problem below, outcomes are still compared per function.
id_policy = "strip_params"

[divergence.ids]
# EMPTY as of Phase 4 Task 1: `pytest.raises`'s legacy callable form and the missing
# `ExceptionInfo` readers (`.tb`, `.match()`) are implemented (commit bb03e06), and with
# them the 50 failures across 46 functions this section used to name.
[divergence.global]
ids = """\
PARAMETRIZE ID GENERATION, the same mechanism click's ledger records in full. Here the \
values are functions: pytest names a lambda `<lambda>0`/`<lambda>1` and a named function \
by its `__name__` (`auto_aiter`, `iter`, `reversed`), while rustest emits \
`param<index>`; and `test_groupby_case`'s multi-line string values are truncated at 17 \
characters. 95 of 909 ids differ, none of them by more than spelling. PHASE-4 / \
KNOWN-LIMITATION."""
