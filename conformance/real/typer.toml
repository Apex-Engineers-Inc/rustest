# typer -- a CLI-framework suite where most tests launch the tutorial scripts in
# subprocesses (`python -m coverage run ...`), with `filterwarnings = ["error"]`,
# `--strict-config`, `--strict-markers` and `strict_xfail`. Terminal-output tests, so rich's
# rendering and shellingham's shell detection matter.

[repo]
kind = "oss"
url = "https://github.com/fastapi/typer.git"
tag = "0.29.2"
# Lightweight tag; commit SHA directly.
rev = "2517edde5a1292a712e2f16e600754c52c6f00d9"
test_paths = ["tests"]

[env]
# Test dependencies are the `tests` dependency group in pyproject.toml: coverage, pytest,
# pytest-cov, pytest-sugar, pytest-xdist, rich, shellingham (plus mypy, ty, ruff, which are
# type-check and lint tools the tests do not import). `coverage` IS installed even though no
# addopts uses it: roughly 190 test files run the example scripts as
# `python -m coverage run <script>` in a subprocess, so without it they fail for a reason
# unrelated to either runner. pytest-cov, pytest-sugar (reporting) and pytest-xdist
# (distribution) are left out; rustest loads no pytest11 plugins, so each would be a
# difference with nothing to do with compatibility.
#
# pytest 9.2.0, not the corpus's 8.4.2: the project requires `pytest>=9.0.0` and configures
# pytest only through the native `[tool.pytest]` table (`minversion = "9.0"`, addopts,
# filterwarnings = error), which pytest 8 does not read. 9.2.0 is the newest stable pytest 9.
setup = [
  ["uv", "venv", "--python", "3.14", "{venv}"],
  [
    "uv", "pip", "install", "--python", "{py}",
    "pytest==9.2.0", "coverage[toml]>=7.13", "rich>=12.3.0", "shellingham>=1.3.0",
  ],
  ["uv", "pip", "install", "--python", "{py}", "-e", "{repo}"],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-1.0.0rc1-cp314-cp314-win_amd64.whl",
  ],
]
pythonpath = []

[run]
pytest_args = []
rustest_args = []
timeout_s = 1800
id_policy = "exact"

[divergence.ids]
[divergence.global]
