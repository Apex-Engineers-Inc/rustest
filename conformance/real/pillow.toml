# Pillow -- KEEP-with-ledgered-hooks (Phase 4 Task 1b batch 2). Two conftest.py files, both
# LIMITED (full text quoted in the audit):
#   /conftest.py (repo root, 3 lines): `pytest_plugins = ["Tests.helper"]` -- registers
#   Tests/helper.py as an in-repo plugin module. Currently a no-op: helper.py defines ZERO
#   `pytest_*` hooks (it's pure assert-helpers + skip-decorator factories + the `hopper()`
#   test-image loader, all called directly by test bodies, not hook machinery).
#   Tests/conftest.py (49 lines): `pytest_configure` registers exactly two markers via
#   `config.addinivalue_line` (`pil_noop_mark`, `valgrind_known_error`, the latter
#   try/excepted so it's a no-op if pytest-valgrind is already installed) -- textbook LIMITED.
#   `pytest_report_header` injects `PIL.features.pilinfo()` output into the header (cosmetic).
#   `pytest_terminal_summary` can `pytest.exit(..., returncode=1)` but ONLY under a
#   free-threaded (`Py_GIL_DISABLED`) build where the GIL got re-enabled mid-run -- dormant on
#   a standard (non-`t`) cp314 build, which is what this draft targets.
# No collect_ignore, no pytest_generate_tests, no custom collectors, no pytest_collect_file.
# New domain: image codec I/O, versus everything else in the corpus.

[repo]
kind = "oss"
url = "https://github.com/python-pillow/Pillow.git"
tag = "12.3.0"
# Lightweight tag (RELEASING.md's documented procedure is a bare `git tag X.Y.Z`, no `-a`).
rev = "bb1d8e8ab8d29048624d96e3ee53cecf7c13d13d"
test_paths = ["Tests"]

[env]
# BUILD-REQUIREMENT NOTE (the audit's item 4 ask): Pillow's C extension is built via a custom
# pybind11-based build backend (`_custom_build/`) linking libjpeg/zlib/libtiff/libwebp/etc --
# an editable/from-source install (`-e {repo}`, the pattern every other OSS target in this
# corpus uses) would force a LOCAL COMPILE requiring those system image libraries + a C
# toolchain, which this task's constraints rule out. Verified instead: PyPI publishes
# `pillow-12.3.0-cp314-cp314-win_amd64.whl` (7,237,707 bytes, not yanked,
# requires_python>=3.10) for the exact pinned version -- so this draft installs Pillow
# NON-EDITABLE, by version pin from PyPI, and uses `{repo}` (checked out at the matching tag)
# only as the source of the `Tests/` tree, not as an install target. No local compilation is
# needed on cp314/win_amd64 for this pin.
#
# [project.optional-dependencies].tests: coverage, defusedxml, markdown2, olefile, packaging,
# pytest, pytest-cov, pytest-timeout, pytest-xdist, setuptools, trove-classifiers. Installed
# below: the plain hard-import libs a handful of format-specific tests need directly
# (defusedxml for XML-based format security tests, markdown2, olefile for FPX/MIC OLE-based
# formats, packaging for version-comparison helpers). Left out as coverage/build/perf-only,
# same convention as every other target in this corpus: coverage, pytest-cov, pytest-timeout
# (nothing in [addopts] activates it under this pin -- see below), pytest-xdist, setuptools,
# trove-classifiers. Also left out: numpy and the test-arrow extra (arro3-*/pyarrow/nanoarrow)
# -- both are tox-only / a separate optional extra, not in the PEP 621 "tests" group; the
# array-interop tests that need them should skip cleanly rather than error, same acceptance
# tabulate/humanize made for their own optional extras.
setup = [
  ["uv", "venv", "--python", "3.14", "{venv}"],
  # Pinned to the SAME pytest the corpus gates use as their oracle (8.4.2).
  ["uv", "pip", "install", "--python", "{py}", "pytest==8.4.2", "defusedxml", "markdown2", "olefile", "packaging"],
  # Non-editable, version-pinned install from PyPI -- see the build-requirement note above.
  ["uv", "pip", "install", "--python", "{py}", "pillow==12.3.0"],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-0.16.2-cp314-cp314-win_amd64.whl",
  ],
]
pythonpath = []

[addopts]
# pyproject.toml declares `[tool.pytest]` (addopts = ["-ra", "--color=auto"], testpaths =
# ["Tests"]) -- NOT `[tool.pytest.ini_options]`. This is pytest 9's native TOML config table
# (added in pytest 9.0, per direct confirmation while researching psutil's identical pattern);
# this corpus's oracle pin, pytest==8.4.2, predates that and does not read `[tool.pytest]` at
# all, so this whole block is silently inert to the pytest leg. tox.ini has no [pytest]
# section as a fallback (just [testenv] deps/commands: pytest-sugar, numpy, `--dist worksteal
# --numprocesses auto -W always`, not replayed, same treatment as more-itertools'/tabulate's
# tox invocations). Both declared flags are cosmetic (verbosity/color) so dropping costs
# nothing functionally; `testpaths=["Tests"]` is separately covered by `[repo].test_paths`.
# OPEN ITEM for the implementer: confirm whether rustest's own pyproject-config reader also
# ignores bare `[tool.pytest]` (matching pytest 8.4.2) or already supports it like pytest 9 --
# if rustest reads it and pytest 8.4.2 doesn't, that mismatch (e.g. `--color=auto` on one side
# only) is itself a source of divergence, not just a dropped no-op.
configured = ["-ra", "--color=auto"]
replay = []
dropped = ["-ra", "--color=auto"]

[run]
pytest_args = []
rustest_args = []
timeout_s = 1800
# UNVERIFIED, and honestly so: no Pillow test has ever executed under rustest (see the ledger
# below), so the draft's guess about parametrize id spelling has not been tested either way.
# `strip_params` is left in place only because it keeps the blocker's 2150 consequences
# readable. Re-decide this the moment the blocker is fixed.
id_policy = "strip_params"

[divergence.ids]
"*pillow/Tests/*" = """\
NEW MECHANISM (first sighting in this sweep), and the second of the two blockers this sweep \
found that cost an entire suite: **`pytest.skip(reason, allow_module_level=True)` is not \
honoured.** rustest collected **zero** of Pillow's 4036 tests.

`allow_module_level=True` is pytest's sanctioned way to skip a whole module from its top level \
-- the standard idiom for "this file needs an optional dependency" or "this file is for another \
platform". rustest's `decorators.py::skip` ignores the flag and raises `Skipped` unconditionally, \
which escapes module import and is recorded as a COLLECTION ERROR. Collection errors then abort \
the session -- which is correct, pytest aborts too -- so six skipped modules zero the entire run.

The six, each a plain optional-dependency or platform guard:
  Tests/oss-fuzz/test_fuzzers.py  "Fuzzer doesn't run on Windows or iOS"
  Tests/test_arro3.py             "Arro3 not installed"
  Tests/test_image_array.py       "NumPy not installed"
  Tests/test_nanoarrow.py         "Nanoarrow not installed"
  Tests/test_numpy.py             "NumPy not installed"
  Tests/test_pyarrow.py           "PyArrow not installed"

pytest skips all six as modules and runs the other 4036 tests. Minimal repro -- two files, one
with a module-level skip and one ordinary:

    # test_aml.py
    import pytest
    pytest.skip("module-level skip", allow_module_level=True)
    def test_never_runs(): assert False
    # test_other.py
    def test_ordinary(): assert True

pytest: `1 passed, 1 skipped`. rustest: `1 error`, and `test_other.py::test_ordinary` never runs \
-- the collateral damage is the whole point.

This entry globs the suite deliberately: 2150 function-level divergences, one cause. It goes \
stale the moment the flag is honoured, at which point this target must be re-run and re-ledgered \
from scratch -- everything the audit wanted from this pick (C-extension image I/O, the \
`pytest_plugins = ["Tests.helper"]` root conftest, the marker-registering `pytest_configure`, the \
CLI-tool-gated skips) is STILL UNMEASURED. rustest DEFECT. PHASE-4-FOLLOWUP."""

[divergence.global]
ids = """\
4036 ids in pytest, 0 in rustest -- wholly the `allow_module_level` blocker ledgered above, not \
an id-spelling question. The draft's `strip_params` guess about parametrize ids remains \
untested."""
exit_code = """\
pytest exits 0 (3745 passed / 288 skipped / 3 xfailed, nothing failed); rustest exits 2 (6 \
collection errors, session aborted). Same blocker."""
tally = """\
pytest 3745 passed / 288 skipped / 3 xfailed across 4036 ids; rustest 0 of everything with 6 \
collection errors. Same blocker."""
# Expected friction to flag, not pre-waived -- ALL of it still unmeasured, because rustest never
# collected a single test:
# - Tests/images/, Tests/fonts/, Tests/icc/ hold a large binary format-sample corpus bundled
#   directly in the repo tree (not fetched separately) -- irrelevant to install size (wheel
#   install doesn't pull it), but the checked-out {repo} tree used for test_paths is sizeable.
# - djpeg/ImageMagick/GraphicsMagick/netpbm CLI-tool-gated tests (helper.py's
#   djpeg_available()/netpbm_available()/magick_command()) should skip identically on both
#   engines absent those binaries -- confirm at gate time rather than assume.
