# packaging -- a heavily parametrized suite (tens of thousands of cases) with a selection-changing addopts
# (`-m "not property"`), `--strict-markers`, `--strict-config`, `--showlocals`, `-ra`,
# `xfail_strict`, `filterwarnings = ["error"]` and `log_level = "INFO"`.

[repo]
kind = "oss"
url = "https://github.com/pypa/packaging.git"
tag = "26.3"
# Annotated tag; this is the commit it points at, not the tag object's own SHA.
rev = "929fd4b1410ac7ef61ef3f45b2f5d7e87711a9b5"
test_paths = ["tests"]

[env]
# Test dependencies are the `test` dependency group in pyproject.toml: hypothesis, pip,
# pretend, tomli_w (tomli only below Python 3.11) and coverage. coverage is tracing
# tooling nothing in the tests imports, so it is left out. hypothesis is imported by the
# property tests (`tests/property/`), which addopts deselects but which still import it at
# collection, so it is installed.
setup = [
  ["uv", "venv", "--python", "3.14", "{venv}"],
  [
    "uv", "pip", "install", "--python", "{py}",
    "pytest==8.4.2", "hypothesis>=6.0.0", "pip>=21.1", "pretend", "tomli_w",
  ],
  ["uv", "pip", "install", "--python", "{py}", "-e", "{repo}"],
  [
    "uv",
    "pip",
    "install",
    "--python",
    "{py}",
    "--reinstall-package",
    "rustest",
    "{wheels}/rustest-1.0.0rc1-cp314-cp314-win_amd64.whl",
  ],
]
pythonpath = []

[run]
pytest_args = []
rustest_args = []
timeout_s = 1800
id_policy = "exact"

[divergence.ids]
[divergence.global]
