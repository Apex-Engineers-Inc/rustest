# A pytester file in a session with a controller-only plugin, graded against REAL pytest-xdist:
# rustest runs the pytester file under its own pytest process as one more xdist worker and
# replays that process's reports to the controller with the pool's. The plugin turns the failing
# session into exit 0 only when it saw all twelve phase reports, the pytester file's included.
# This repository's .venv must not have xdist, so the oracle's answer is pinned; re-derive it
# with `conformance/tests/test_pinned.py` (its docstring has the one command).
[case]
args = ["-n", "2"]

[pinned]
source = "pytest 9.0.2 + pytest-xdist 3.8.0, -n 2"
pytest = "9.0.2"
xdist = "3.8.0"
ids = ["test_a.py::test_one", "test_a.py::test_fails", "test_b_pytester.py::test_inner", "test_c.py::test_after"]
exit_code = 0
outcomes = { passed = 3, failed = 1, skipped = 0, xfailed = 0, xpassed = 0, errors = 0, deselected = 0 }
