# Documented divergences between pytest's collection and `rustest --v2-collect-only`.
#
# This is the Phase 1b.1 gate's ledger, kept separate from waivers.toml (the v1
# end-to-end ledger) because an entry in one says nothing about the other. Two
# concrete examples of why: `collection/class-collection` is waived for v1 (v1
# collects methods on a class with __init__; pytest refuses them) and MATCHES here --
# that case is the headline target of this sub-phase. `collection/empty-suite` is
# waived for v1 (exit 0 where pytest exits 5) and MATCHES here at 5/5.
#
# Every entry MUST carry the mechanism and a file:line. Phase gates shrink this file;
# a waiver whose case starts matching is reported as a STALE-WAIVER and fails the run.
#
# Gate: `uv run python -m conformance --v2-collect`
# Scoreboard at 1b.1: 20 cases -- 17 match, 3 waived, 0 stale-waivers, 0 diverged.
[cases]

"marks/mark-filter" = "PREDICTED (plan pre-authorizes; selection args land in 1b.2). case.toml passes `-m smoke`. pytest applies mark selection during --collect-only, so it emits only test_smoke_only and deselects test_unmarked; v2 emits both (`extra in v2: ['test_marks.py::test_unmarked']`). Exit codes agree (0/0). Mechanism, in argument order: (1) the CLI never forwards the option -- python/rustest/cli.py:178-185 short-circuits on `--v2-collect-only` and calls `v2_collect_only(paths=..., workers=...)`, so `args.mark_expr` is parsed and then dropped on the floor; (2) even if it reached the Rust side, an option-looking argument is skipped by both path consumers, src/v2/collect.rs:401 (`initial_paths`) and src/v2/config.rs:928 (`get_dirs_from_args`), each a faithful port of `_pytest/config/findpaths.py::get_dirs_from_args`; (3) the worker does carry the mark as data -- `_rustest_mark_specs` reads `__rustest_marks__` (python/rustest/_v2_worker.py:655) -- but never evaluates it, which the module documents as a deliberate scope limit at python/rustest/_v2_worker.py:29-31 ('Marks are carried, never evaluated ... evaluation is Phase 1b.2'). So the mark metadata needed for selection is already on the wire; what is missing is a selection stage, which belongs with the execution engine in 1b.2. NOT a collection-rule defect: with the `-m` removed, this case's two ids match pytest byte for byte."

"marks/deselect-all" = "PREDICTED (plan pre-authorizes; selection args land in 1b.2). Same single mechanism as marks/mark-filter -- `-m nosuchmark` from case.toml is never forwarded (python/rustest/cli.py:178-185) and would be dropped as an option-looking arg anyway (src/v2/collect.rs:401, src/v2/config.rs:928) -- shown here in its exit-code form: pytest deselects the case's only test, is left with zero collected, and exits 5 ('1 deselected'); v2 collects test_smoke_only and exits 0. Reported as `extra in v2: ['test_marks.py::test_smoke_only']; exit codes pytest=5 v2=0`. Explicitly NOT the v1 exit-code gap that waivers.toml records for this same case (python/rustest/cli.py:229-234 -- collection_errors -> 2, failed -> 1, else -> 0, with no zero-collected branch; waivers.toml cites the pre-Task-4 line numbers 200-209): v2 has a correct exit-5 branch and uses it -- collection/empty-suite MATCHES at 5/5 on this gate, and python/tests/test_v2_collect_cli.py::test_empty_tree_exits_5 pins it directly. The exit code here is purely downstream of the un-honored `-m`; nothing else about this case diverges."

"fixtures/parametrized-fixture" = "PREDICTED and pre-authorized by the plan (fixture-closure ids are a 1b.2 capability). `@pytest.fixture(params=[1, 2])` parametrizes every test that requests the fixture, so pytest collects test_number[1] and test_number[2]; v2 collects a single test_number. Mechanism: v2's parametrization comes exclusively from decorator metadata on the test function -- python/rustest/_v2_worker.py:741 reads `__rustest_parametrization__` off the function and returns None when it is absent, and _collect_function (python/rustest/_v2_worker.py:897-941) then emits exactly one entry. Expanding a fixture's `params` instead requires the fixture CLOSURE (which fixture names a test resolves to, walking the conftest chain), and the worker is handed one file at a time and is never told about conftest files -- the protocol's `Init` message (src/v2/protocol.rs:46-54) carries only rootdir and the naming patterns, and `CollectFile` (src/v2/protocol.rs:56) carries a single path -- no conftest chain, no fixture registry. That makes it a protocol/architecture change, not a local fix; the limitation is documented in the worker itself at python/rustest/_v2_worker.py:32-38. Deferred rather than partially implemented on Task 2's recommendation (p1b1-task-2-report.md section 7): a partial closure would emit WRONG ids -- under-expansion is visible in a diff, but mis-ordered id components (pytest's IdMaker applies to fixture params too) are not, and a wrong id that looks right is worse than a waived gap. Closes in 1b.2, where the closure has to exist for execution anyway."
