# Documented divergences between pytest's collection and `rustest --v2-collect-only`.
#
# This is the Phase 1b.1 gate's ledger, kept separate from waivers.toml (the v1
# end-to-end ledger) because an entry in one says nothing about the other. Two
# concrete examples of why: `collection/class-collection` is waived for v1 (v1
# collects methods on a class with __init__; pytest refuses them) and MATCHES here --
# that case is the headline target of this sub-phase. `collection/empty-suite` is
# waived for v1 (exit 0 where pytest exits 5) and MATCHES here at 5/5.
#
# Every entry MUST carry the mechanism and a file:line. Phase gates shrink this file;
# a waiver whose case starts matching is reported as a STALE-WAIVER and fails the run.
#
# Gate: `uv run python -m conformance --v2-collect`
# Scoreboard at 1b.1: 21 cases -- 18 match, 3 waived, 0 stale-waivers, 0 diverged.
#
# Node ids are compared as an ORDERED list, so a case can diverge on collection order
# or on a duplicated id with the id sets identical on both sides. None does today.
[cases]

"marks/mark-filter" = "PREDICTED (plan pre-authorizes; selection args land in 1b.2). case.toml passes `-m smoke`. pytest applies mark selection during --collect-only, so it emits only test_smoke_only and deselects test_unmarked; v2 emits both (`extra in v2: ['test_marks.py::test_unmarked']`). Exit codes agree (0/0). Mechanism, in argument order: (1) the CLI never forwards the option -- python/rustest/cli.py:178-185 short-circuits on `--v2-collect-only` and calls `v2_collect_only(paths=..., workers=...)`, so `args.mark_expr` is parsed and then dropped on the floor; (2) even if it reached the Rust side, an option-looking argument is skipped by both path consumers, src/v2/collect.rs:403-406 (`initial_paths`) and src/v2/config.rs:928 (`get_dirs_from_args`), each a faithful port of `_pytest/config/findpaths.py::get_dirs_from_args`; (3) the worker carries the mark as data -- `_rustest_mark_specs` reads `__rustest_marks__` (python/rustest/_v2_worker.py:831). UPDATED AFTER P1b.2 TASK 3: marks are no longer merely carried -- the worker now EVALUATES them at execution time (`evaluate_skip_marks` / `evaluate_xfail_marks`, python/rustest/_v2_worker.py:2873 and :2945, called from `_run_phases` at :3362), which is what closed #131. That does not touch this case: skip/skipif/xfail decide a test's OUTCOME once it runs, whereas `-m` decides whether a test is collected at all. No deselection stage exists anywhere -- neither the CLI, nor `v2_collect_only`, nor the worker's `collect_file` consults a mark expression, and `src/mark_expr.rs` (the v1 evaluator) has no v2 caller. So the mark metadata needed for selection is on the wire and the outcome-side evaluation has landed; what is still missing is the selection stage itself, which belongs with the orchestrator's argument handling. NOT a collection-rule defect: with the `-m` removed, this case's two ids match pytest byte for byte."

"marks/deselect-all" = "PREDICTED (plan pre-authorizes; selection args land in 1b.2). Same single mechanism as marks/mark-filter -- `-m nosuchmark` from case.toml is never forwarded (python/rustest/cli.py:178-185) and would be dropped as an option-looking arg anyway (src/v2/collect.rs:401, src/v2/config.rs:928) -- shown here in its exit-code form: pytest deselects the case's only test, is left with zero collected, and exits 5 ('1 deselected'); v2 collects test_smoke_only and exits 0. Reported as `extra in v2: ['test_marks.py::test_smoke_only']; exit codes pytest=5 v2=0`. Explicitly NOT the v1 exit-code gap that waivers.toml records for this same case (python/rustest/cli.py:229-234 -- collection_errors -> 2, failed -> 1, else -> 0, with no zero-collected branch; waivers.toml cites the pre-Task-4 line numbers 200-209): v2 has a correct exit-5 branch and uses it -- collection/empty-suite MATCHES at 5/5 on this gate, and python/tests/test_v2_collect_cli.py::test_empty_tree_exits_5 pins it directly. The exit code here is purely downstream of the un-honored `-m`; nothing else about this case diverges."
